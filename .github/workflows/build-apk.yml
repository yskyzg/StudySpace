name: 构建安卓 APK

# 触发方式：
# 1) 每次把代码推送到 main / master 分支时自动构建
# 2) 也可以在 GitHub 网页 Actions 页面手动点击 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle（加快后续构建）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装依赖
        run: npm install

      # 网页文件（index.html）在仓库根目录，这里自动建一个 www 目录并放进去，
      # 这样 Capacitor 就能按配置里的 webDir: "www" 找到它。
      - name: 准备网页资源目录
        run: |
          mkdir -p www
          cp index.html www/index.html

      # 版本号只有一个来源：package.json 的 version。
      # 先写进待打包的 www/index.html（App 关于页显示的版本），
      # 后面再写 Android 的 versionName（系统「应用信息」显示的版本）；
      # 任何一边没写进去就让构建失败，避免发出去一个版本对不上的包。
      # 注意这步必须在 npx cap sync 之前，否则 android 资源里还是旧版本号。
      - name: 写入 App 内显示版本（注入 www/index.html）
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "package.json version = $APP_VER"
          sed -i -E "s/var APP_VERSION='[^']*';/var APP_VERSION='$APP_VER';/" www/index.html
          grep -q "var APP_VERSION='$APP_VER';" www/index.html || { echo "::error::index.html 的 APP_VERSION 未写入 $APP_VER"; exit 1; }

      - name: 重新生成 Android 工程
        run: rm -rf android && npx cap add android

      # 用仓库根目录 assets/logo.svg 生成各密度桌面图标与启动图，
      # 覆盖 cap add android 自带的 Capacitor 默认机器人图标。
      - name: 生成 StudySpace 图标与启动图
        run: |
          if [ -f assets/logo.svg ]; then
            npx @capacitor/assets generate --android --assetPath assets \
              --iconBackgroundColor '#F6F1E5' \
              --iconBackgroundColorDark '#F6F1E5' \
              --splashBackgroundColor '#F6F1E5' \
              --splashBackgroundColorDark '#F6F1E5'
          else
            echo "::warning::未找到 assets/logo.svg，本次使用默认图标"
          fi

      - name: 写入系统版本号（Android versionName）
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VER\"/" android/app/build.gradle
          grep -q "versionName \"$APP_VER\"" android/app/build.gradle || { echo "::error::android versionName 未写入 $APP_VER"; exit 1; }
          grep -nE 'versionCode|versionName' android/app/build.gradle || true

      - name: 同步网页资源
        run: npx cap sync android

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      # 固定调试签名：不依赖 runner 的 ~/.android/debug.keystore（可能被 AGP 重建/忽略），
      # 直接把仓库里的 PKCS12 放进生成的 Android 工程，并在 build.gradle 里显式指定。
      - name: 固定调试签名（保证覆盖安装保留数据）
        run: |
          base64 -d android.keystore.b64 > android/app/studyspace.p12
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          # versionCode 用 GitHub Actions 构建序号，保证每次新包都是升级而不是同版本重装
          vc = int(os.environ.get('GITHUB_RUN_NUMBER', '2'))
          s = s.replace('versionCode 1', 'versionCode ' + str(vc), 1)
          m = re.search(r'(?m)^(\s*)buildTypes\s*\{\s*$', s)
          if not m:
              raise SystemExit('未找到 buildTypes，无法写入签名配置')
          indent = m.group(1)
          sig = (indent + 'signingConfigs {\n' +
                 indent + '    debug {\n' +
                 indent + "        storeFile file('studyspace.p12')\n" +
                 indent + "        storePassword 'android'\n" +
                 indent + "        storeType 'PKCS12'\n" +
                 indent + "        keyAlias 'androiddebugkey'\n" +
                 indent + "        keyPassword 'android'\n" +
                 indent + '    }\n' +
                 indent + '}\n')
          s = s[:m.start()] + sig + s[m.start():]
          m2 = re.search(r'(?m)^(\s*)buildTypes\s*\{\s*$', s)
          i = m2.group(1)
          s = (s[:m2.end()] + '\n' + i + '    debug {\n' +
               i + '        signingConfig signingConfigs.debug\n' +
               i + '    }' + s[m2.end():])
          p.write_text(s)
          print('已写入固定签名配置，versionCode=' + str(vc))
          PY

      - name: 构建 Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 输出 APK 签名指纹（排查覆盖安装）
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'Owner:|Issuer:|SHA256:' || true

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: StudySpace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
