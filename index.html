<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StudySpace</title>
<style>
:root{
  --paper:#F4E9D0; --card:#FDF8EC; --line:#E8DCC0;
  --ink:#2B2620; --ink2:#7A7062;
  --dai:#3D5A80; --dai2:#5E7A9C; --dai3:#E6EBF2;
  --zhu:#B93A26; --zhubg:#F4E0D8;
  --qing:#6B8E5A; --teng:#C99A2E; --zhe:#B03A2E;
  --shadow:0 2px 12px rgba(90,60,20,.08);
  --r-card:16px; --r-btn:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color:var(--ink); background:var(--paper);
  min-height:100%; overscroll-behavior:none;
  font-size:13px;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 全屏 App 外壳 */
.phone{
  width:100%;height:100dvh;background:var(--paper);
  position:relative;display:flex;flex-direction:column;overflow:hidden;
}
.statusbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:11px;color:var(--ink2);background:var(--paper)}
.statusbar b{color:var(--ink)}
.mini-timer{display:none;flex:none;height:34px;align-items:center;gap:8px;
  padding:0 14px;background:var(--dai);color:#fff;font-size:12px;cursor:pointer}
.mini-timer.show{display:flex}
.mini-timer .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.mini-timer .t{margin-left:auto;font-weight:600;font-size:13px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 80px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,4px)}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink2);cursor:pointer;font-size:11px;min-height:56px}
.tabbar .tab.on{color:var(--dai)}
.tabbar .tab.on .ico{stroke:var(--dai)}
.tabbar .ico{width:24px;height:24px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 通用 */
.page-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px;min-height:40px}
.page-head .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--dai);font-size:24px;flex:none;border-radius:10px}
.page-head .title{font-size:16px;font-weight:600;flex:1;text-align:center;margin-right:40px}
.hero-title{font-size:20px;font-weight:600;color:var(--dai);margin:4px 0 2px}
.hero-sub{font-size:11.5px;color:var(--ink2);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sec-title{font-size:14px;font-weight:600;margin:2px 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title .more{font-size:11.5px;color:var(--dai);font-weight:400;cursor:pointer}
.muted{color:var(--ink2)}
.tiny{font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;align-items:center;gap:10px}
.btn{border:none;border-radius:var(--r-btn);min-height:44px;padding:0 16px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--dai);color:#fff}
.btn.primary:active{background:#34507a}
.btn.ghost{background:var(--card);color:var(--dai);border:1px solid var(--dai)}
.btn.danger{background:var(--zhe);color:#fff}
.btn.sm{min-height:36px;font-size:12.5px;padding:0 12px}
.btn.block{width:100%}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:38px;border:none;background:var(--card);color:var(--dai);
  font-size:20px;cursor:pointer;font-family:inherit}
.stepper .v{min-width:48px;text-align:center;font-weight:600;font-size:14px}
.stepper input.v{border:none;background:transparent;width:56px;padding:0;color:var(--ink);
  font-family:inherit;font-weight:600;font-size:14px;-moz-appearance:textfield}
.stepper input.v::-webkit-inner-spin-button,.stepper input.v::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* 首页 */
.goal-card{background:var(--dai);color:#fff;border-radius:var(--r-card);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.goal-card.done{box-shadow:inset 0 0 0 2px var(--zhu)}
.goal-card .lab{font-size:12px;opacity:.85}
.goal-card .big{font-size:30px;font-weight:600;margin:6px 0 2px}
.goal-card .big small{font-size:14px;font-weight:400;opacity:.85}
.bar{height:8px;background:rgba(255,255,255,.28);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .35s ease}
.goal-card .foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;margin-top:7px}
.kpi{display:flex;gap:12px;margin-bottom:12px}
.kpi .card{flex:1;margin:0;padding:14px}
.kpi .n{font-size:24px;font-weight:600;margin-top:4px}
.kpi .n.red{color:var(--zhu)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.chk{width:22px;height:22px;border:2px solid var(--dai2);border-radius:7px;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.chk.on{background:var(--qing);border-color:var(--qing)}
.todo-item.done .tt{text-decoration:line-through;color:var(--ink2)}
.todo-item .tt{flex:1;font-size:13px}
.todo-item .pg{font-size:12px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .b .col{width:100%;background:var(--dai2);border-radius:5px 5px 0 0;min-height:3px;transition:height .3s}
.bars .b.today .col{background:var(--dai)}
.bars .b .lb{font-size:9.5px;color:var(--ink2)}
.ai-tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.6}
.ai-tip .hd{color:var(--dai);font-weight:600;margin-bottom:4px;font-size:12px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.5}
.empty .btn{margin-top:16px}

/* 专注页 */
.mode-switch{display:flex;gap:8px;margin-bottom:14px}
.mode-switch .m{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);cursor:pointer;font-size:12.5px;color:var(--ink2)}
.mode-switch .m.on{background:var(--dai3);border-color:var(--dai);color:var(--dai);font-weight:600}
.dial-wrap{position:relative;width:250px;height:250px;margin:6px auto 10px}
.dial{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:#E6DCC4;stroke-width:13}
.dial .prog{fill:none;stroke:var(--dai);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial-center .phase{font-size:12px;color:var(--ink2)}
.dial-center .time{font-size:46px;font-weight:600;letter-spacing:1px;margin:2px 0}
.dial-center .subj{font-size:12px;color:var(--dai);display:flex;align-items:center;gap:6px}
.focus-actions{display:flex;gap:10px;margin-bottom:8px}
.focus-actions .btn.primary{flex:1}
.record-link{display:block;text-align:center;color:var(--dai);font-size:12px;padding:8px;cursor:pointer}
.fold-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.fold-head .arw{color:var(--ink2);transition:transform .2s}
.fold-head.open .arw{transform:rotate(90deg)}
.fold-body{display:none;padding-top:12px}
.fold-body.open{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.dist .b{margin-bottom:8px}
.dist .b .lb{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.dist .b .track{height:8px;background:#EFE7D2;border-radius:6px;overflow:hidden}
.dist .b .track>i{display:block;height:100%;border-radius:6px}

/* 下拉框 */
.picker-anchor{width:100%}
.picker-btn{width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:var(--r-btn);
  display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;font-size:13.5px}
.picker-btn .arw{margin-left:auto;color:var(--ink2);font-size:11px}
.picker-btn .nm{flex:1;text-align:left}
.picker-pop{position:absolute;z-index:130;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(60,40,10,.18);overflow:hidden;min-width:180px;max-height:280px;overflow-y:auto}
.picker-pop .pi{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.picker-pop .pi:last-child{border-bottom:none}
.picker-pop .pi:active{background:var(--dai3)}
.picker-pop .pi.sel{background:var(--dai3);color:var(--dai);font-weight:600}
.picker-pop .pi.new{color:var(--dai);font-weight:600;border-top:1px solid var(--line)}
.picker-pop .pi .ck{margin-left:auto}

/* 目标页 */
.rings{display:flex;gap:10px;margin-bottom:12px}
.ring-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px;box-shadow:var(--shadow);text-align:center}
.ring-card svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring-card .track{fill:none;stroke:#EFE7D2;stroke-width:10}
.ring-card .prog{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-card .lbl{font-size:12px;color:var(--ink2);margin-top:2px}
.ring-card .val{font-size:11px;color:var(--ink2);margin-top:2px}
.ring-num{font-size:19px;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.heat i{aspect-ratio:1;border-radius:4px;background:#EFE7D2}
.subj-prog{margin-bottom:14px}
.subj-prog .top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:6px;cursor:pointer}
.subj-prog .track{height:10px;background:#EFE7D2;border-radius:6px;overflow:hidden}
.subj-prog .track>i{display:block;height:100%;border-radius:6px;transition:width .35s}
.subj-prog.unset .track>i{opacity:.35}
.badge-unset{font-size:10px;color:var(--ink2);background:#EFE7D2;border-radius:20px;padding:1px 8px}
.badge-del{font-size:10px;color:var(--zhe);background:var(--zhubg);border-radius:20px;padding:2px 9px;cursor:pointer}
.month-chips{display:flex;flex-wrap:wrap;gap:8px}
.month-chip{font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink2);background:#fff}
.month-chip.on{background:var(--dai);border-color:var(--dai);color:#fff;font-weight:600}
.arch-filter{display:flex;gap:10px}
.arch-filter .af-col{flex:1;min-width:0}
.arch-filter .picker-btn{height:44px}
.arch-pop{position:static;width:100%;margin-top:4px;max-height:230px;overflow:auto}
.arch-del{font-size:10px;color:var(--zhe);background:var(--zhubg);border-radius:20px;padding:2px 9px;cursor:pointer;margin-left:8px;white-space:nowrap}
.goal-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal-row:last-child{border-bottom:none}
.goal-row .nm{flex:1;font-size:13px;display:flex;align-items:center;gap:8px}
.goal-row .stepper button{width:32px;height:32px}
.goal-row .stepper .v{min-width:42px;font-size:12.5px}

/* 我的 */
.mine-head{background:var(--dai);border-radius:var(--r-card);padding:18px;color:#fff;margin-bottom:12px}
.mine-head .nm{font-size:17px;font-weight:600}
.mine-head .gs{font-size:12px;opacity:.9;margin-top:6px}
.menu-group{margin-bottom:12px}
.menu-group .gt{font-size:11.5px;color:var(--ink2);padding:4px 6px 6px}
.menu-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  padding:14px 16px;cursor:pointer;font-size:13.5px}
.menu-item:first-of-type{border-radius:12px 12px 0 0}
.menu-item:last-child{border-radius:0 0 12px 12px}
.menu-item + .menu-item{border-top:none}
.menu-item .ic{width:22px;height:22px;stroke:var(--dai);fill:none;stroke-width:1.7}
.menu-item .arw{margin-left:auto;color:var(--ink2)}

/* 科目管理 */
.subj-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.subj-item:last-child{border-bottom:none}
.subj-item .nm{flex:1;font-size:13.5px}
.subj-item .types{font-size:11px;color:var(--ink2)}
.subj-item .edit{font-size:12px;color:var(--dai);cursor:pointer;padding:6px}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 4px}
.color-grid .c{aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-grid .c.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(30,22,10,.45);z-index:100;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet .sh .t{font-size:15px;font-weight:600;color:var(--dai)}
.sheet .sh .x{font-size:20px;color:var(--ink2);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.fld input,.fld select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;
  padding:0 12px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
.sheet-foot{display:flex;gap:10px;margin-top:18px}
.sheet-foot .btn{flex:1}
.confirm{max-width:320px;width:calc(100% - 40px);background:var(--card);border-radius:16px;
  padding:20px;margin:auto;box-shadow:var(--shadow);align-self:center}
.confirm .t{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm .d{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;
  z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.placeholder{text-align:center;color:var(--ink2);padding:30px 16px;font-size:12.5px;line-height:1.8}
.placeholder .big{font-size:26px;margin-bottom:8px}
/* ===== 统计图表 ===== */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg .s{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);cursor:pointer;font-size:12px;color:var(--ink2)}
.seg .s.on{background:var(--dai3);border-color:var(--dai);color:var(--dai);font-weight:600}
.chart-svg{width:100%;height:170px;display:block}
.chart-svg .grid{stroke:var(--line);stroke-width:1}
.chart-svg .ln{fill:none;stroke:var(--dai);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .pt{fill:var(--dai)}
.chart-svg .ax{fill:var(--ink2);font-size:9px}
.chart-svg .bar{fill:var(--dai2)}
.chart-svg .bar.today{fill:var(--dai)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.insight{background:var(--dai3);border-radius:10px;padding:10px 12px;font-size:12px;
  color:var(--dai);line-height:1.65;margin-top:10px}
.insight b{font-weight:600}

/* ===== 错题本 ===== */
.mist-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer}
.mist-card .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mist-card .tag{font-size:10px;background:var(--dai3);color:var(--dai);border-radius:20px;padding:2px 8px}
.mist-card .rate{margin-left:auto;font-size:11px;color:var(--zhe);font-weight:600}
.mist-card .ttl{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:6px}
.mist-card .kv{font-size:11.5px;color:var(--ink2);line-height:1.7}
.mist-card .thumbs{display:flex;gap:6px;margin-top:8px}
.mist-card .thumbs img,.mist-card .thumbs .ph{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#EFE7D2}
.mist-card .thumbs .ph{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
.mist-card .due{font-size:10.5px;color:var(--zhu);margin-top:6px}
.big-img{width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
.kv-block{margin-bottom:12px}
.kv-block .k{font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.kv-block .v{font-size:13px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.pill{display:inline-block;font-size:10.5px;background:var(--dai3);color:var(--dai);border-radius:20px;padding:3px 10px;margin:0 6px 6px 0}

/* ===== 复盘 ===== */
.review-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer}
.review-card .d{font-size:11px;color:var(--ink2);margin-bottom:5px}
.review-card .t{font-size:13px;line-height:1.6}
.sec-box{margin-bottom:14px}
.sec-box label{display:block;font-size:12px;font-weight:600;color:var(--dai);margin-bottom:6px}
.sec-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);resize:vertical;line-height:1.6}
.auto-sum{background:var(--dai3);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--ink);line-height:1.8;margin-bottom:14px}
.auto-sum b{color:var(--dai)}

/* ===== AI 助手 ===== */
.chat-list{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .av{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#fff;background:var(--dai)}
.msg.ai .av{background:var(--qing)}
.msg .bubble{max-width:78%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--dai);color:#fff;border-bottom-right-radius:3px}
.msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .bubble b{font-weight:600}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--line);margin-top:10px}
.chat-input textarea{flex:1;min-height:42px;max-height:110px;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);resize:none;line-height:1.5}
.sess-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sess-item .ic{width:18px;height:18px;stroke:var(--dai);fill:none;stroke-width:1.7;flex:none}
.sess-item .nm{flex:1;font-size:13px}
.sess-item .del{font-size:11px;color:var(--zhe);padding:6px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ext-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;text-align:center;cursor:pointer}
.ext-card b{display:block;color:var(--dai);font-size:13px;margin-bottom:2px}

/* 计划月历 */
.cal-nav{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--dai);font-size:12px;white-space:nowrap}
.cal-nav b{font-size:14px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-w{text-align:center;font-size:10px;color:var(--ink2);padding:2px 0}
.cal-d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11.5px;cursor:pointer;border:1px solid transparent}
.cal-d:active{background:var(--dai3)}
.cal-d.blank{cursor:default}
.cal-d.today{background:var(--dai);color:#fff;font-weight:600}
.cal-d.has{border-color:var(--line)}
.cal-d .dots{display:flex;gap:2px;margin-top:3px;height:5px}
.cal-d .dots i{width:4px;height:4px;border-radius:50%}
.cal-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:10px;color:var(--ink2)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:7px;height:7px;border-radius:50%}
/* 图表悬浮/触摸提示 */
#chartTip{position:fixed;z-index:400;pointer-events:none;background:var(--ink);color:#fff;
  font-size:12px;line-height:1.5;padding:7px 11px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.22);
  white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .12s}
#chartTip.on{opacity:1}
.chart-svg .hit{cursor:pointer}
.bar,.pt,.chart-svg path{transition:opacity .12s}
.bar:hover,.bar:active,.chart-svg path:hover,.chart-svg path:active{opacity:.78}

/* ===== 周报 ===== */
.week-hero{background:var(--dai);color:#fff;border-radius:var(--r-card);padding:18px;margin-bottom:12px}
.week-hero .t{font-size:12px;opacity:.85}
.week-hero .n{font-size:32px;font-weight:600;margin:6px 0 2px}
.week-hero .sub{font-size:11.5px;opacity:.9}
.week-stat{display:flex;gap:10px;margin-bottom:12px}
.week-stat .w{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.week-stat .w .n{font-size:19px;font-weight:600;color:var(--dai)}
.week-stat .w .l{font-size:11px;color:var(--ink2);margin-top:3px}

/* 全屏 App：大屏时内容居中限宽，保持手机阅读宽度 */
@media(min-width:560px){
  .phone{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(60,40,10,.12)}
  .mask .sheet{max-width:480px}
}
</style>

<body>

<div class="phone">
  <div class="statusbar"><span id="clock">8:42</span><span><b>StudySpace</b> · 第 <span id="dayCount">1</span> 天</span><span>▮▮▮ 100%</span></div>
  <div class="mini-timer" id="miniTimer" onclick="goTab('focus')">
    <span class="dot" id="miniDot"></span><span id="miniName">专注中</span>
    <span class="t num" id="miniTime">25:00</span><span>›</span>
  </div>
  <div class="screen" id="screen"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheetRoot"></div>
<div id="confirmRoot"></div>
<div id="toast"></div>

<script>
/* ============ 全局常量 ============ */
var KEY='studywr_app_v1';
var KEY_BAK='studywr_app_v1_bak';
var KEY_META='studywr_app_v1_meta';
var PALETTE=[
  {n:'黛蓝',c:'#3D5A80'},{n:'朱红',c:'#B93A26'},{n:'竹青',c:'#6B8E5A'},{n:'藤黄',c:'#C99A2E'},
  {n:'紫檀',c:'#7A4B6B'},{n:'月青',c:'#5B9A9A'},{n:'赭石',c:'#A65D3E'},{n:'松绿',c:'#4F7A5B'},
  {n:'秋香',c:'#9C8A3C'},{n:'胭脂',c:'#9D2933'},{n:'靛青',c:'#2B6B8F'},{n:'茶褐',c:'#7B5E42'}
];
var C={paper:'#F4E9D0',card:'#FDF8EC',line:'#E8DCC0',ink:'#2B2620',ink2:'#7A7062',
  dai:'#3D5A80',dai2:'#5E7A9C',zhu:'#B93A26',qing:'#6B8E5A',teng:'#C99A2E',zhe:'#B03A2E'};

/* ============ 日期工具 ============ */
function dstr(d){var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+dd;}
function shiftDay(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d);}
function today(){return dstr(new Date());}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function minutes(sec){return Math.round(sec/60);}
/* 状态栏：真实时钟 + 累计学习天数 */
function nowClock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function studyDays(){
  var days={};(S.sessions||[]).forEach(function(s){if(s.date)days[s.date]=1;});
  return Math.max(1,Object.keys(days).length);
}
function updateStatusBar(){
  var c=document.getElementById('clock');if(c)c.textContent=nowClock();
  var d=document.getElementById('dayCount');if(d)d.textContent=studyDays();
}

function aiCfgBlank(){
  return {provider:'',apiKey:'',baseUrl:'',model:'',presets:[],models:[]};
}
function makeEmpty(){
  return {subjects:[],goals:{dailyMinutes:120,weeklyMinutes:600},subjectGoals:{},
    sessions:[],plans:[],mistakes:[],reviews:[],chats:[],archives:[],weeklyReports:[],
    profile:{nickname:'学习者',purpose:''},aiConfig:aiCfgBlank()};
}
/* 迁移容错：老数据缺字段时补齐，保证升级不报错、不丢数据 */
function migrate(s){
  if(!s||!s.subjects)return s;
  s.plans=s.plans||[];s.sessions=s.sessions||[];s.mistakes=s.mistakes||[];
  s.reviews=s.reviews||[];s.chats=s.chats||[];s.archives=s.archives||[];
  s.weeklyReports=s.weeklyReports||[];s.subjectGoals=s.subjectGoals||{};
  s.profile=s.profile||{nickname:'学习者',purpose:''};
  s.aiConfig=s.aiConfig||aiCfgBlank();
  if(!s.aiConfig.presets)s.aiConfig.presets=[];
  if(!s.aiConfig.models)s.aiConfig.models=[];
  if(!s.aiConfig.prompts)s.aiConfig.prompts=[];
  s.mistakes.forEach(function(m){
    m.type=m.type||'';m.reason=m.reason||'';m.answer=m.answer||'';
    m.knowledge=m.knowledge||[];m.img=m.img||'';m.answerImg=m.answerImg||'';
    m.nextReview=m.nextReview||m.date||today();m.stage=m.stage||0;m.reviewed=m.reviewed||0;
  });
  s.reviews.forEach(function(r){r.subjects=r.subjects||[];});
  return s;
}
/* 读取单个存储槽：解析失败返回 null，绝不在此覆盖原始数据 */
function readSlot(k){
  try{var raw=localStorage.getItem(k);if(!raw)return null;var s=JSON.parse(raw);
    return (s&&Array.isArray(s.subjects))?s:null;}catch(e){return null;}
}
function load(){
  /* 主槽优先，损坏则从影子备份恢复；两个槽都解析失败时保留原始数据不覆盖 */
  var s=readSlot(KEY)||readSlot(KEY_BAK);
  if(s){try{return migrate(s);}catch(e){return s;}}
  var d=makeEmpty();
  try{
    if(localStorage.getItem(KEY)==null&&localStorage.getItem(KEY_BAK)==null){
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY_BAK,JSON.stringify(d));
    }
  }catch(e){}
  return d;
}
function save(){
  var json;try{json=JSON.stringify(S);}catch(e){return;}
  try{localStorage.setItem(KEY,json);}catch(e){}
  try{localStorage.setItem(KEY_BAK,json);}catch(e){}
  try{localStorage.setItem(KEY_META,JSON.stringify({t:Date.now()}));}catch(e){}
}
/* 关闭/切后台前再刷一次盘，确保最后一次操作不丢 */
function flushSave(){if(typeof S!=='undefined')save();}
window.addEventListener('pagehide',flushSave);
window.addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave();});
var _saveTimer=setInterval(function(){if(typeof S!=='undefined')save();},15000);
var S=load();
/* 各页筛选状态 */
var statRange=7,statSubject='',statType=''; /* 统计页：科目 + 题型联动 */
var mistSubject='',mistType='',mistBatch=false,mistSel={}; /* 错题本 */
var revFilter='all';                    /* 复盘 */
var chatOpenId=null;                   /* AI 助手当前会话 */
function resetEmpty(){confirmDo('清空全部数据？','将删除所有科目、学习记录、计划、目标与归档，回到空白状态。此操作不可撤销。',function(){S=makeEmpty();archMonth=null;save();render();toast('已清空，现在是空白状态');});}

/* ============ 统计 ============ */
/* 统计：可选 subjectId 过滤，不传则为全体科目 */
function sessionsOn(day,subjectId){return S.sessions.filter(function(s){return s.date===day&&(!subjectId||s.subjectId===subjectId);});}
function minutesOn(day,subjectId){return minutes(sessionsOn(day,subjectId).reduce(function(a,s){return a+s.seconds;},0));}
function pomodorosOn(day,subjectId){return sessionsOn(day,subjectId).reduce(function(a,s){return a+(s.pomodoros||1);},0);}
/* 某天某科（可选）新增错题数，可选题型过滤 */
function mistakesOn(day,subjectId,type){return S.mistakes.filter(function(m){
  return m.date===day&&(!subjectId||m.subjectId===subjectId)&&(!type||m.type===type);});}
function todayMin(){return minutesOn(today());}
function weekMin(){var t=0;for(var i=0;i<7;i++)t+=minutesOn(shiftDay(-i));return t;}
function streak(){
  var n=0;for(var i=0;i<400;i++){if(minutesOn(shiftDay(-i))>0)n++;else{if(i===0)continue;break;}}return n;
}
function subjectMin(id,day){return minutes(sessionsOn(day).filter(function(s){return s.subjectId===id;}).reduce(function(a,s){return a+s.seconds;},0));}
function subjectWeekMin(id){var t=0;for(var i=0;i<7;i++)t+=subjectMin(id,shiftDay(-i));return t;}
function subjById(id){return S.subjects.filter(function(s){return s.id===id;})[0];}
function nextColor(){
  var used=S.subjects.map(function(s){return s.color;});
  for(var i=0;i<PALETTE.length;i++){if(used.indexOf(PALETTE[i].c)<0)return PALETTE[i].c;}
  return PALETTE[S.subjects.length%PALETTE.length].c;
}
/* 当前归档月份（默认本月，可切换） */
var archMonth=null;
var archOpenPop=null; /* 归档两级下拉当前展开：null|'year'|'month' */
function curArchMonth(){if(!archMonth)archMonth=today().slice(0,7);return archMonth;}
/* 归档年月树：[{y:'2026',ms:['11','10']}, ...] 年/月均倒序（新的在前），自动跨年分组 */
function archTree(){
  var map={};
  (S.archives||[]).forEach(function(a){
    if(!a.month||a.month.length<7)return;
    var y=a.month.slice(0,4),m=a.month.slice(5,7);
    if(!map[y])map[y]={};
    map[y][m]=true;
  });
  return Object.keys(map).sort().reverse().map(function(y){
    return {y:y,ms:Object.keys(map[y]).sort().reverse()};
  });
}
/* 删除一条归档（二次确认） */
function delArchive(id){
  confirmDo('删除这条归档？','删除后不可恢复，归档列表与筛选会同步更新。',function(){
    S.archives=(S.archives||[]).filter(function(a){return a.id!==id;});
    var tree=archTree();
    if(!tree.length){archMonth=today().slice(0,7);}
    else{
      var ok=tree.some(function(n){return n.y===archMonth.slice(0,4)&&n.ms.indexOf(archMonth.slice(5,7))>=0;});
      if(!ok)archMonth=tree[0].y+'-'+tree[0].ms[0];
    }
    archOpenPop=null;save();render();toast('已删除归档');
  });
}
/* 两级下拉交互 */
function toggleArchPop(which){archOpenPop=(archOpenPop===which?null:which);render();}
function setArchYear(y){
  var node=archTree().filter(function(n){return n.y===y;})[0];
  archMonth=y+'-'+(node?node.ms[0]:'01');archOpenPop=null;render();
}
function setArchMonth(m){archMonth=archMonth.slice(0,4)+'-'+m;archOpenPop=null;render();}
/* 归档当前目标：把当前目标+本月成果存成一条快照，并在本月归档里可见 */
function archiveGoals(){
  var m=curArchMonth();
  var detail='日目标 '+S.goals.dailyMinutes+' 分 · 周目标 '+S.goals.weeklyMinutes+' 分 · 本周完成 '+weekMin()+' 分 · 连续 '+streak()+' 天';
  confirmDo('归档当前学习目标？','将把当前目标与本月成果存成一条快照，放入对应月份的归档中，不会删除现有目标。',function(){
    S.archives.push({id:uid(),kind:'goal',month:m,date:today(),title:'学习目标快照',detail:detail});
    save();render();toast('已归档学习目标');
  });
}
/* 归档以往计划：把日期早于今天的计划存入归档，从当前计划列表移除 */
function archivePlans(){
  var old=S.plans.filter(function(p){return p.date<today();});
  if(!old.length){toast('没有可归档的以往计划');return;}
  confirmDo('归档 '+old.length+' 条以往计划？','这些计划将从「今日计划」移入归档，按月可查，不会删除。',function(){
    old.forEach(function(p){
      var s=subjById(p.subjectId);
      var line=(s?s.name:'未分类')+' · 预计 '+(p.estMin||0)+' 分 · '+(p.done?'已完成':'未完成');
      S.archives.push({id:uid(),kind:'plan',month:p.date.slice(0,7),date:p.date,title:p.title,detail:line});
    });
    S.plans=S.plans.filter(function(p){return p.date>=today();});
    save();render();toast('已归档 '+old.length+' 条计划');
  });
}
/* 删除单个已设的分科目目标 */
function delSubjectGoal(id){
  var s=subjById(id);
  confirmDo('删除「'+(s?s.name:'该科目')+'」的目标？','删除后该科目进度显示为「未设目标」，历史学习记录不受影响。',function(){
    delete S.subjectGoals[id];save();render();toast('已删除该科目目标');
  });
}

/* ============ 路由 ============ */
var R={tab:'home',stack:[]};
function goTab(t){R.tab=t;R.stack=[];archOpenPop=null;closeSheet();render();}
function push(page,arg){archOpenPop=null;R.stack.push({page:page,arg:arg});render();}
function back(){archOpenPop=null;if(R.stack.length)R.stack.pop();render();}
function curPage(){return R.stack.length?R.stack[R.stack.length-1].page:null;}

/* ============ 计时器 ============ */
var T={mode:'down',subjectId:null,focusMin:25,restMin:5,running:false,phase:'focus',remain:25*60,elapsed:0};
var timerId=null;
function fmtSec(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),ss=s%60;return ('0'+m).slice(-2)+':'+('0'+ss).slice(-2);}
function tick(){
  if(!T.running)return;
  if(T.mode==='down'){
    T.remain--;T.elapsed++;
    if(T.remain<=0){
      T.running=false;
      if(T.phase==='focus'){recordSession(T.elapsed);toast('专注完成！已自动记录，进入休息');T.phase='rest';T.remain=T.restMin*60;}
      else{toast('休息结束，准备下一轮');T.phase='focus';T.remain=T.focusMin*60;}
      T.elapsed=0;render();return;
    }
  }else{T.elapsed++;T.remain++;}
  updateTimerUI();
}
function updateTimerUI(){
  var tm=document.getElementById('dialTime');if(tm)tm.textContent=fmtSec(T.mode==='down'?T.remain:T.elapsed);
  var ring=document.getElementById('dialProg');if(ring){
    var total=(T.mode==='down')?(T.phase==='focus'?T.focusMin:T.restMin)*60:T.focusMin*60;
    var pct=T.mode==='down'?(1-T.remain/total):(T.elapsed/total);
    pct=Math.max(0,Math.min(1,pct));
    var CIRC=2*Math.PI*105;
    ring.setAttribute('stroke-dashoffset',CIRC*(1-pct));
  }
  var ph=document.getElementById('dialPhase');if(ph)ph.textContent=T.phase==='focus'?(T.mode==='down'?'专注中':'正向计时'):'休息中';
  var mn=document.getElementById('miniTime');if(mn)mn.textContent=fmtSec(T.mode==='down'?T.remain:T.elapsed);
  var mn2=document.getElementById('miniName');if(mn2)mn2.textContent=(T.phase==='focus'?'专注':'休息')+(T.subjectId&&subjById(T.subjectId)?' · '+subjById(T.subjectId).name:'');
  var btn=document.getElementById('mainTimerBtn');if(btn)btn.textContent=T.running?'暂停':'开始专注';
  var dot=document.getElementById('miniDot');if(dot&&T.subjectId&&subjById(T.subjectId))dot.style.background=subjById(T.subjectId).color;
}
function toggleTimer(){
  if(!T.running){
    if(!T.subjectId){toast('先选一个科目');return;}
    T.running=true;
    if(!timerId)timerId=setInterval(tick,1000);
    toast('开始计时');
  }else{T.running=false;toast('已暂停');}
  render();
}
function resetTimer(){T.running=false;T.phase='focus';T.remain=T.focusMin*60;T.elapsed=0;render();toast('已重置');}
function recordSession(sec){
  if(sec<1){return false;}
  if(!T.subjectId){toast('没有科目，未记录');return false;}
  S.sessions.push({id:uid(),subjectId:T.subjectId,seconds:sec,pomodoros:Math.max(1,Math.round(sec/1500)),date:today(),time:nowClock()});
  save();return true;
}
/* 中途结束并记录：倒计时/正向均可，停表 + 落一条真实记录 */
function manualRecord(){
  if(!T.subjectId){toast('先选一个科目');return;}
  var sec=Math.floor(T.elapsed);
  if(sec<1){toast('还没有专注时长，先开始计时');return;}
  T.running=false;                       /* 真正结束计时，避免后台继续累加 */
  var ok=recordSession(sec);
  T.elapsed=0;T.remain=T.focusMin*60;T.phase='focus';
  render();toast(ok?'已记录本次专注 '+Math.ceil(sec/60)+' 分钟':'未记录');
}
if(!timerId)timerId=setInterval(tick,1000);

/* ============ 通用 UI ============ */
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},1600);}
function closeSheet(){document.getElementById('sheetRoot').innerHTML='';document.getElementById('confirmRoot').innerHTML='';}
function sheet(title,body,foot){
  document.getElementById('sheetRoot').innerHTML=
    '<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+
    '<div class="sh"><span class="t">'+title+'</span><span class="x" onclick="closeSheet()">×</span></div>'+
    body+'<div class="sheet-foot">'+(foot||'<button class="btn primary block" onclick="closeSheet()">完成</button>')+'</div>'+
    '</div></div>';
}
function confirmDo(title,desc,fn){
  window.__confirmFn=fn;
  document.getElementById('confirmRoot').innerHTML=
    '<div class="mask"><div class="confirm"><div class="t">'+title+'</div><div class="d">'+desc+'</div>'+
    '<div class="sheet-foot"><button class="btn ghost" onclick="closeSheet()">取消</button>'+
    '<button class="btn danger" onclick="var f=window.__confirmFn;closeSheet();if(f)f()">确定</button></div></div></div>';
}
/* 科目下拉框：anchorId 按钮容器 id；cb 回调 id */
function picker(anchorId,cbName,current){
  var el=document.getElementById(anchorId);if(!el)return;
  var old=document.getElementById('pickerPop');if(old)old.remove();
  var pop=document.createElement('div');pop.className='picker-pop';pop.id='pickerPop';
  var r=el.getBoundingClientRect();
  pop.style.left=Math.max(10,r.left)+'px';
  pop.style.top=(r.bottom+4)+'px';
  pop.style.width=r.width+'px';
  var html='';
  if(!S.subjects.length){
    html='<div class="pi" onclick="'+cbName+'(null);closePicker()"><span class="muted">还没有科目，点此新建</span></div>';
  }else{

/* ============ SVG 圆环 ============ */
function ring(pct,color,size,stroke,centerHtml){
  var CIRC=2*Math.PI*((size-stroke)/2);
  var r=(size-stroke)/2;
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;transform:rotate(-90deg)">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" class="track" stroke-width="'+stroke+'" fill="none" stroke="#EFE7D2"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" class="prog" stroke-width="'+stroke+'" fill="none" stroke="'+color+'" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC*(1-Math.max(0,Math.min(1,pct))))+'"/>'+
    '</svg>';
}
function ringCard(label,val,goal,color){
  var pct=goal?val/goal:0;
  var CIRC=2*Math.PI*42;
  return '<div class="ring-card">'+
    '<div style="position:relative;width:104px;height:104px;margin:0 auto">'+
    '<svg viewBox="0 0 104 104" style="transform:rotate(-90deg)">'+
    '<circle cx="52" cy="52" r="42" class="track" fill="none" stroke-width="10"/>'+
    '<circle cx="52" cy="52" r="42" class="prog" fill="none" stroke="'+color+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC*(1-Math.min(1,pct)))+'"/>'+
    '</svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="ring-num num">'+Math.round(pct*100)+'%</div>'+
    '</div>'+
    '<div class="lbl">'+label+'</div><div class="val num">'+val+' / '+goal+' 分钟</div></div>';
}

/* 智能提醒：全部基于本机真实数据，无数据给引导 */
function tipShort(){
  var due=dueMistakes().length,undone=S.plans.filter(function(p){return p.date===today()&&!p.done;}).length;
  if(!S.subjects.length)return '还没有科目。先到「我的 → 科目管理」建立科目，就能开始专注与记录目标了。';
  if(!S.sessions.length)return '还没有专注记录。完成第一个番茄后，这里会根据你的数据给出提醒。点击展开 ›';
  if(due)return '有 '+due+' 道错题今天该复习了，按 1/3/7 天节奏重做效果最好。点击展开 ›';
  if(undone)return '今天还有 '+undone+' 项计划待完成，先做最重要的一件。点击展开 ›';
  return '今日学习节奏不错，保持连续打卡。点击展开 ›';
}
function expandTip(){
  var b=document.getElementById('tipBody');if(!b)return;

function pickFocusSubject(id){

function saveFocus(){try{localStorage.setItem(KEY+'_focus',JSON.stringify({subjectId:T.subjectId,focusMin:T.focusMin,restMin:T.restMin,mode:T.mode}));}catch(e){}}
function loadFocus(){try{var f=JSON.parse(localStorage.getItem(KEY+'_focus')||'{}');if(f.subjectId)T.subjectId=f.subjectId;if(f.focusMin)T.focusMin=f.focusMin;if(f.restMin)T.restMin=f.restMin;if(f.mode)T.mode=f.mode;T.remain=T.focusMin*60;}catch(e){}}
loadFocus();
function setMode(m){T.mode=m;T.running=false;T.phase='focus';T.remain=T.focusMin*60;T.elapsed=0;saveFocus();render();}
function step(field,delta,min,max){
  T[field]=Math.max(min,Math.min(max,T[field]+delta));
  if(field==='focusMin'&&!T.running&&T.phase==='focus')T.remain=T.focusMin*60;
  if(field==='restMin'&&!T.running&&T.phase==='rest')T.remain=T.restMin*60;
  saveFocus();render();
}
/* 手动输入时长：失焦时校正到范围并同步计时器 */
function setTimerField(field,val,min,max){
  var n=parseInt(val,10);if(isNaN(n))n=T[field];
  n=Math.max(min,Math.min(max,n));T[field]=n;
  if(field==='focusMin'&&!T.running&&T.phase==='focus')T.remain=T.focusMin*60;
  if(field==='restMin'&&!T.running&&T.phase==='rest')T.remain=T.restMin*60;
  saveFocus();render();
}
function pageFocus(){
  var s=subjById(T.subjectId);
  var total=(T.mode==='down')?(T.phase==='focus'?T.focusMin:T.restMin)*60:T.focusMin*60;
  var pct=T.mode==='down'?(1-T.remain/total):(T.elapsed/total);
  var CIRC=2*Math.PI*105;
  var dial='<svg class="dial" viewBox="0 0 230 230">'+
    '<circle class="track" cx="115" cy="115" r="105"/>'+

    '</svg>'+
    '<div class="dial-center"><div class="phase" id="dialPhase">'+(T.phase==='focus'?(T.mode==='down'?'专注中':'正向计时'):'休息中')+'</div>'+
    '<div class="time num" id="dialTime">'+fmtSec(T.mode==='down'?T.remain:T.elapsed)+'</div>'+
    '<div class="subj">'+(s?'<span class="dot" style="background:'+s.color+'"></span>'+esc(s.name):'<span class="muted">未选科目</span>')+'</div></div>';
  var dist='';
  var mmax=Math.max(1,S.subjects.reduce(function(a,x){return Math.max(a,subjectMin(x.id,today()));},0));
  if(S.subjects.length){S.subjects.forEach(function(x){
    var m=subjectMin(x.id,today());
    dist+='<div class="b"><div class="lb"><span>'+esc(x.name)+'</span><span class="num">'+m+' 分</span></div>'+
      '<div class="track"><i style="width:'+(m/mmax*100)+'%;background:'+x.color+'"></i></div></div>';
  });}else{dist='<div class="muted tiny">还没有科目</div>';}
  return '<div class="hero-title" style="font-size:18px">专注</div><div class="hero-sub">进去就能开始，设置不打扰</div>'+
    '<div class="mode-switch"><div class="m'+(T.mode==='down'?' on':'')+'" onclick="setMode(\'down\')">倒计时</div>'+
    '<div class="m'+(T.mode==='up'?' on':'')+'" onclick="setMode(\'up\')">正向计时</div></div>'+
    '<div style="margin-bottom:14px">'+pickerBtn('focusPick',s?s.name:'',s?s.color:'','picker(\'focusPick\',\'pickFocusSubject\',\''+(T.subjectId||'')+'\')','选择当前科目')+'</div>'+
    '<div class="dial-wrap">'+dial+'</div>'+
    '<div class="focus-actions"><button class="btn primary" id="mainTimerBtn" onclick="toggleTimer()">'+(T.running?'暂停':'开始专注')+'</button>'+
    '<button class="btn ghost" onclick="resetTimer()">重置</button></div>'+
    '<div class="record-link" onclick="manualRecord()">结束并记录已专注时长 ›</div>'+
    '<div class="card"><div class="fold-head" id="foldHead" onclick="toggleFold()"><span style="font-weight:600;font-size:13.5px">计时设置</span><span class="arw">›</span></div>'+
    '<div class="fold-body" id="foldBody">'+
      '<div class="set-row"><span>专注时长（分钟）</span><span class="stepper"><button onclick="step(\'focusMin\',-5,1,180)">−</button><input class="v num" type="number" id="focusMinV" min="1" max="180" value="'+T.focusMin+'" onchange="setTimerField(\'focusMin\',this.value,1,180)"><button onclick="step(\'focusMin\',5,1,180)">+</button></span></div>'+
      '<div class="set-row"><span>休息时长（分钟）</span><span class="stepper"><button onclick="step(\'restMin\',-1,1,60)">−</button><input class="v num" type="number" id="restMinV" min="1" max="60" value="'+T.restMin+'" onchange="setTimerField(\'restMin\',this.value,1,60)"><button onclick="step(\'restMin\',1,1,60)">+</button></span></div>'+

function openPlanEditor(id){
  var p=S.plans.filter(function(x){return x.id===id;})[0];if(!p)return;
  window.__editPlan=id;
  window.__planSubject=p.subjectId||null;
  var sb=p.subjectId?subjById(p.subjectId):null;
  var known=sb&&sb.types&&sb.types.indexOf(p.type)>=0;

  renderPlanSheet();
}
function npStep(d){var e=document.getElementById('npMin');var v=Math.max(5,Math.min(240,(parseInt(e.value)||5)+d));e.value=v;}
function npClamp(){var e=document.getElementById('npMin');if(!e)return;var v=parseInt(e.value);if(isNaN(v))v=45;e.value=Math.max(5,Math.min(240,v));}
function delPlan(id){
  confirmDo('删除这条计划？','删除后不可恢复。',function(){
    S.plans=S.plans.filter(function(x){return x.id!==id;});
    window.__editPlan=null;save();closeSheet();render();toast('已删除计划');
  });
}
function savePlan(){
  var t=document.getElementById('npTitle').value.trim();
  if(!t){toast('请输入标题');return;}
  if(!window.__planSubject){toast('请先选择科目');return;}
  var type=window.__planType;
  if(type==='__custom__'){
    var ci=document.getElementById('npCustomType');
    type=ci?ci.value.trim():'';
    if(!type){toast('请输入自定义题型');return;}
  }
  var est=Math.max(5,Math.min(240,parseInt(document.getElementById('npMin').value)||45));
  var wasEdit=!!window.__editPlan;
  var planDate=window.__draftPlanDate||today();
  if(wasEdit){
    var p=S.plans.filter(function(x){return x.id===window.__editPlan;})[0];
    if(p){p.title=t;p.subjectId=window.__planSubject;p.type=type||'';p.estMin=est;p.doneMin=Math.min(p.doneMin||0,est);p.date=planDate;}
  }else{
    S.plans.push({id:uid(),title:t,subjectId:window.__planSubject,type:type||'',
      estMin:est,doneMin:0,done:false,date:planDate});
  }
  window.__planType='';window.__planCustom='';window.__editPlan=null;window.__draftPlanTitle='';window.__draftPlanDate=null;
  save();closeSheet();render();toast(wasEdit?'已保存计划':'已添加计划');
}

/* ============ 页面：计划 ============ */
/* 月历：始终显示完整日历网格，有计划的日子带圆点 */
var planCalMonth=null;   /* 'YYYY-MM' */
function curPlanMonth(){if(!planCalMonth)planCalMonth=today().slice(0,7);return planCalMonth;}
function planMonthShift(n){
  var y=parseInt(curPlanMonth().slice(0,4),10),m=parseInt(curPlanMonth().slice(5,7),10)+n;
  var d=new Date(y,m-1,1);planCalMonth=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render();
}
function plansOn(ds){return S.plans.filter(function(p){return p.date===ds;});}
function planCalendarHtml(){
  var ym=curPlanMonth(),y=parseInt(ym.slice(0,4),10),m=parseInt(ym.slice(5,7),10);
  var firstDow=(new Date(y,m-1,1).getDay()+6)%7;   /* 周一为 0 */
  var days=new Date(y,m,0).getDate();
  var t=today();
  var h='<div class="sec-title">计划月历 <span class="cal-nav"><span onclick="planMonthShift(-1)">‹</span><b>'+y+' 年 '+m+' 月</b><span onclick="planMonthShift(1)">›</span></span></div>';
  h+='<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(w){h+='<div class="cal-w">'+w+'</div>';});
  for(var i=0;i<firstDow;i++)h+='<div class="cal-d blank"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
    var ps=plansOn(ds);
    var doneN=ps.filter(function(p){return p.done;}).length;
    var dots='';
    if(ps.length){
      dots='<div class="dots">'+(doneN?'<i style="background:'+C.qing+'"></i>':'')+
        (doneN<ps.length?'<i style="background:'+C.dai+'"></i>':'')+'</div>';
    }
    h+='<div class="cal-d'+(ds===t?' today':'')+(ps.length?' has':'')+'" title="'+ds+(ps.length?' · '+ps.length+' 项计划':'')+'" onclick="openDayPlans(\''+ds+'\')">'+
      '<span>'+d+'</span>'+dots+'</div>';
  }
  h+='</div><div class="cal-legend"><span><i style="background:'+C.dai+'"></i>待完成</span>'+
    '<span><i style="background:'+C.qing+'"></i>已完成</span><span>点日期查看当天计划</span></div>';
  return h;
}
function openDayPlans(ds){
  var ps=plansOn(ds);
  var body='<div class="tiny muted" style="margin-bottom:10px">'+ds+'</div>';
  if(!ps.length){body+='<div class="placeholder" style="padding:18px">这一天还没有计划</div>';}
  else{
    body+=ps.map(function(p){
      var s=subjById(p.subjectId);
      return '<div class="todo-item'+(p.done?' done':'')+'"><span class="dot" style="background:'+(s?s.color:C.ink2)+'"></span>'+
        '<span class="tt" onclick="closeSheet();openPlanEditor(\''+p.id+'\')" style="cursor:pointer">'+esc(p.title)+'<br>'+
        '<span class="tiny muted">'+(p.done?'已完成':'待完成')+' · 预计 '+(p.estMin||0)+' 分</span></span></div>';
    }).join('');
  }
  sheet(ds+' · 当日计划',body,
    '<button class="btn ghost" onclick="closeSheet()">关闭</button>'+
    '<button class="btn primary" onclick="openNewPlanFor(\''+ds+'\')">＋ 当天新增计划</button>');
}
function openNewPlanFor(ds){openNewPlan();window.__draftPlanDate=ds;renderPlanSheet();}
function pagePlan(){
  var undone=S.plans.filter(function(p){return p.date===today()&&!p.done;});
  var done=S.plans.filter(function(p){return p.date===today()&&p.done;});
  var rate=S.plans.length?Math.round(S.plans.filter(function(p){return p.done;}).length/S.plans.length*100):0;
  function item(p){
    var s=subjById(p.subjectId);
    return '<div class="todo-item'+(p.done?' done':'')+'"><div class="chk'+(p.done?' on':'')+'" onclick="togglePlan(\''+p.id+'\')">'+(p.done?'✓':'')+'</div>'+
      '<span class="dot" style="background:'+(s?s.color:C.ink2)+'"></span><span class="tt" onclick="openPlanEditor(\''+p.id+'\')" style="cursor:pointer">'+esc(p.title)+'<br><span class="tiny muted">'+(s?esc(s.name):'未分类')+' · '+esc(p.type||'未选题型')+' · 预计 '+(p.estMin||0)+' 分</span></span>'+
      '<span class="pg num">'+(p.doneMin||0)+'/'+(p.estMin||0)+' 分</span>'+
      '<span class="edit" style="color:'+C.dai+';font-size:12px;cursor:pointer;padding:6px" onclick="openPlanEditor(\''+p.id+'\')">编辑</span></div>';
  }
  var oldCnt=S.plans.filter(function(p){return p.date<today();}).length;
  return '<div class="hero-title" style="font-size:18px">计划</div><div class="hero-sub">今天日期 · 完成率 '+rate+'%</div>'+
    '<div class="card"><div class="sec-title">待完成 <span class="more">'+undone.length+' 项</span></div>'+
      (undone.length?undone.map(item).join(''):'<div class="placeholder" style="padding:16px">今天的任务都完成了 ✓</div>')+'</div>'+
    (done.length?'<div class="card"><div class="sec-title">已完成 <span class="more">'+done.length+' 项</span></div>'+done.map(item).join('')+'</div>':'')+
    '<div class="card">'+planCalendarHtml()+'</div>'+
    '<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between">'+
      '<span class="tiny muted">以往记录 '+(oldCnt?oldCnt+' 条可归档':'已全部归档')+'</span>'+
      '<button class="btn ghost sm" onclick="archivePlans()"'+(oldCnt?'':' disabled style="opacity:.45"')+'>归档以往计划</button></div></div>'+
    '<button class="btn primary block" onclick="openNewPlan()">＋ 新增计划</button>';
}

function pageGoals(){
  var tm=todayMin(),wm=weekMin(),dg=S.goals.dailyMinutes,wg=S.goals.weeklyMinutes;
  var rings='<div class="rings">'+ringCard('日目标',tm,dg,C.dai)+ringCard('周目标',wm,wg,C.zhu)+'</div>';
  /* 热力图 近28天 */
  var heat='';
  for(var i=27;i>=0;i--){
    var m=minutesOn(shiftDay(-i));
    var bg=m===0?'#EFE7D2':m<20?'#CBD6E2':m<40?'#8FA7C0':m<60?'#5E7A9C':C.dai;
    heat+='<i title="'+shiftDay(-i)+' · '+m+'分" style="background:'+bg+'"></i>';
  }
  /* 分科目进度 */
  var sp='';
  if(!S.subjects.length){sp='<div class="placeholder" style="padding:16px">还没有科目，先到「科目管理」新建</div>';}
  else{
    var totalToday=Math.max(1,tm);
    S.subjects.forEach(function(s){
      var g=S.subjectGoals[s.id];
      var val=g?((g.dailyMinutes?subjectMin(s.id,today())/g.dailyMinutes:0)+(g.weeklyMinutes?subjectWeekMin(s.id)/g.weeklyMinutes:0))/((g.dailyMinutes?1:0)+(g.weeklyMinutes?1:0)):subjectMin(s.id,today())/totalToday;
      val=Math.max(0,Math.min(1,val));
      var lab=g?(subjectMin(s.id,today())+' / 日 '+g.dailyMinutes+' 分'):(subjectMin(s.id,today())+' 分 · 占总时长 '+Math.round(subjectMin(s.id,today())/totalToday*100)+'%');
      /* 已设目标的科目：右侧给删除按钮；未设的显示灰标 */
      var badge=g?'<span class="badge-del" onclick="event.stopPropagation();delSubjectGoal(\''+s.id+'\')" title="删除该科目目标">✕ 删除</span>':'<span class="badge-unset">未设目标</span>';
      sp+='<div class="subj-prog'+(g?'':' unset')+'"><div class="top" onclick="push(\'subjectDetail\',\''+s.id+'\')">'+
        '<span><span class="dot" style="background:'+s.color+'"></span> '+esc(s.name)+' <span class="tiny muted num">'+lab+'</span></span>'+
        badge+'</div>'+
        '<div class="track"><i style="width:'+(val*100)+'%;background:'+s.color+'"></i></div></div>';
    });
  }
  return '<div class="page-head"><span class="back" onclick="back()">‹</span><span class="title">学习目标</span></div>'+
    rings+
    '<div class="card"><div class="sec-title">连续打卡 <span style="color:'+C.zhu+';font-weight:600" class="num">'+streak()+' 天</span></div>'+
      '<div class="tiny muted" style="margin-bottom:6px">近 4 周学习热力图 · 颜色越深时长越长</div><div class="heat">'+heat+'</div></div>'+
    '<div class="card"><div class="sec-title">分科目进度 <span class="more" onclick="openGoalEditor()">编辑目标 ›</span></div>'+sp+'</div>'+
    '<div class="focus-actions"><button class="btn ghost" onclick="archiveGoals()">归档目标</button>'+
    '<button class="btn primary" onclick="openGoalEditor()">编辑目标</button></div>';
}
function openGoalEditor(){
  var rows='';
  if(!S.subjects.length){rows='<div class="muted tiny">还没有科目，先新建科目后才能设置分科目标。</div>';}
  else{S.subjects.forEach(function(s){
    var g=S.subjectGoals[s.id]||{dailyMinutes:0,weeklyMinutes:0};
    rows+='<div class="goal-row"><span class="nm"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+'</span>'+
      '<span class="stepper"><button onclick="goalStep(\''+s.id+'\',\'dailyMinutes\',-10)">−</button><input class="v num" type="number" id="g_'+s.id+'_d" min="0" max="1440" value="'+g.dailyMinutes+'" onblur="goalClamp()"><button onclick="goalStep(\''+s.id+'\',\'dailyMinutes\',10)">+</button></span>'+
      '<span class="stepper"><button onclick="goalStep(\''+s.id+'\',\'weeklyMinutes\',-50)">−</button><input class="v num" type="number" id="g_'+s.id+'_w" min="0" max="10080" value="'+g.weeklyMinutes+'" onblur="goalClamp()"><button onclick="goalStep(\''+s.id+'\',\'weeklyMinutes\',50)">+</button></span></div>';
  });}
  sheet('编辑目标',
    '<div class="fld"><label>全局每日目标（分钟）</label><span class="stepper"><button onclick="gStep(\'dailyMinutes\',-10)">−</button><input class="v num" type="number" id="gg_d" min="0" max="1440" value="'+S.goals.dailyMinutes+'" onblur="goalClamp()"><button onclick="gStep(\'dailyMinutes\',10)">+</button></span></div>'+
    '<div class="fld"><label>全局每周目标（分钟）</label><span class="stepper"><button onclick="gStep(\'weeklyMinutes\',-50)">−</button><input class="v num" type="number" id="gg_w" min="0" max="10080" value="'+S.goals.weeklyMinutes+'" onblur="goalClamp()"><button onclick="gStep(\'weeklyMinutes\',50)">+</button></span></div>'+
    '<div class="fld"><label style="font-weight:600;color:'+C.ink+'">分科目目标</label><div class="tiny muted" style="margin-bottom:6px">左：每日分钟 · 右：每周分钟 · 0 表示未设置</div>'+rows+'</div>',
    '<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn primary" onclick="saveGoalEditor()">保存目标</button>');
}
function gStep(f,d){var e=document.getElementById('gg_'+(f==='dailyMinutes'?'d':'w'));var mx=f==='dailyMinutes'?1440:10080;var v=Math.max(0,Math.min(mx,(parseInt(e.value)||0)+d));e.value=v;}
function goalStep(id,f,d){var e=document.getElementById('g_'+id+'_'+(f==='dailyMinutes'?'d':'w'));var mx=f==='dailyMinutes'?1440:10080;var v=Math.max(0,Math.min(mx,(parseInt(e.value)||0)+d));e.value=v;}
function goalClamp(){['gg_d','gg_w'].concat(S.subjects.map(function(s){return 'g_'+s.id+'_d';}),S.subjects.map(function(s){return 'g_'+s.id+'_w';})).forEach(function(id){
  var e=document.getElementById(id);if(!e)return;var mx=9000;var v=parseInt(e.value);if(isNaN(v))v=0;e.value=Math.max(0,Math.min(mx,v));});}
function saveGoalEditor(){
  S.goals.dailyMinutes=Math.max(0,parseInt(document.getElementById('gg_d').value)||0);
  S.goals.weeklyMinutes=Math.max(0,parseInt(document.getElementById('gg_w').value)||0);
  S.subjects.forEach(function(s){
    var d=Math.max(0,parseInt(document.getElementById('g_'+s.id+'_d').value)||0);
    var w=Math.max(0,parseInt(document.getElementById('g_'+s.id+'_w').value)||0);
    if(d>0||w>0)S.subjectGoals[s.id]={dailyMinutes:d,weeklyMinutes:w};
    else delete S.subjectGoals[s.id];
  });
  save();closeSheet();render();toast('目标已保存');
}

/* 图表节点提示：鼠标移入或手指触摸时显示对应数据 */
function showChartTip(el,evt){
  var tip=document.getElementById('chartTip');
  if(!tip){tip=document.createElement('div');tip.id='chartTip';document.body.appendChild(tip);}
  tip.textContent=el.getAttribute('data-tip')||'';
  var x,y;
  if(evt.touches&&evt.touches.length){x=evt.touches[0].clientX;y=evt.touches[0].clientY;}
  else{x=evt.clientX;y=evt.clientY;}
  tip.style.left=Math.max(70,Math.min(window.innerWidth-70,x))+'px';
  tip.style.top=Math.max(40,y)+'px';
  tip.classList.add('on');
  if(evt.type==='touchstart'||evt.type==='click'){
    clearTimeout(tip._t);tip._t=setTimeout(function(){tip.classList.remove('on');},2200);
  }
}
function hideChartTip(){var tip=document.getElementById('chartTip');if(tip)tip.classList.remove('on');}
function chartHit(x,y,r,tip){
  return '<circle class="hit" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="transparent" data-tip="'+esc(tip)+'" '+
    'onmouseenter="showChartTip(this,event)" onmouseleave="hideChartTip()" '+
    'ontouchstart="showChartTip(this,event)" onclick="showChartTip(this,event)"/>';
}
function svgLine(days){
  /* days: [{label,val,color?}] 折线图 */
  if(!days.length)return '';
  var W=320,H=150,pl=28,pr=8,pt=12,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  var mx=Math.max.apply(null,days.map(function(d){return d.val;}).concat([1]));
  var step=days.length>1?iw/(days.length-1):0;
  var pts=days.map(function(d,i){return [pl+i*step, pt+ih-(d.val/mx)*ih];});
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(var g=0;g<=3;g++){var y=pt+ih-(g/3)*ih;s+='<line class="grid" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>';
    s+='<text class="ax" x="2" y="'+(y+3)+'">'+Math.round(mx*g/3)+'</text>';}
  s+='<polyline class="ln" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    s+=chartHit(p[0],p[1],11,days[i].label+' · '+days[i].val+(days[i].unit||' 分钟'));
    s+='<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="3"/>';
    if(days.length<=10||i%Math.ceil(days.length/6)===0)s+='<text class="ax" x="'+p[0]+'" y="'+(H-6)+'" text-anchor="middle">'+days[i].label+'</text>';
  });
  return s+'</svg>';
}
function svgBars(items){
  /* items:[{label,val,color?}] */
  if(!items.length)return '';
  var W=320,H=150,pl=26,pr=8,pt=12,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  var mx=Math.max.apply(null,items.map(function(d){return d.val;}).concat([1]));
  var bw=iw/items.length*0.62,step=iw/items.length;
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(var g=0;g<=3;g++){var y=pt+ih-(g/3)*ih;s+='<line class="grid" x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'"/>';
    s+='<text class="ax" x="2" y="'+(y+3)+'">'+Math.round(mx*g/3)+'</text>';}
  items.forEach(function(d,i){var h=(d.val/mx)*ih,x=pl+i*step+(step-bw)/2,y=pt+ih-h;
    s+='<rect class="bar'+(i===items.length-1?' today':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(2,h)+'" rx="3"'+(d.color?' fill="'+d.color+'"':'')+'/>';
    s+=chartHit(x+bw/2,pt+ih-Math.max(2,h)/2,Math.max(bw,14),d.label+' · '+d.val+(d.unit||''));
    if(items.length<=10||i%Math.ceil(items.length/6)===0)s+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+d.label+'</text>';});
  return s+'</svg>';
}
/* 首页专用紧凑柱状图（带点击/触摸提示） */
function homeMiniBars(items){

function svgPie(parts){
  /* parts:[{label,val,color}] 环形饼图 */
  var total=parts.reduce(function(a,p){return a+p.val;},0);
  var s='<svg class="chart-svg" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid meet">';
  if(total<=0){return s+'<text class="ax" x="160" y="85" text-anchor="middle">暂无数据</text></svg>';}
  var cx=90,cy=80,r=58,ir=34,acc=-Math.PI/2;
  parts.forEach(function(p){
    if(p.val<=0)return;
    var ang=p.val/total*Math.PI*2,a2=acc+ang;
    var x1=cx+r*Math.cos(acc),y1=cy+r*Math.sin(acc),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    var xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2),xi2=cx+ir*Math.cos(acc),yi2=cy+ir*Math.sin(acc);
    var large=ang>Math.PI?1:0;
    var path='<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L'+xi1+' '+yi1+' A'+ir+' '+ir+' 0 '+large+' 0 '+xi2+' '+yi2+' Z" fill="'+p.color+'"/>';
    s+=path;
    var mid=acc+ang/2,hx=cx+(r+ir)/2*Math.cos(mid),hy=cy+(r+ir)/2*Math.sin(mid);
    s+=chartHit(hx,hy,(r-ir)/2,p.label+' · '+p.val+' 分钟 · '+Math.round(p.val/total*100)+'%');
    acc=a2;
  });
  s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="17" font-weight="600" fill="'+C.dai+'">'+total+'</text>';
  parts.forEach(function(p,i){var y=40+i*20;
    s+='<rect class="legend-hit" x="180" y="'+(y-11)+'" width="130" height="18" fill="transparent" data-tip="'+esc(p.label+' · '+p.val+' 分钟 · '+Math.round(p.val/total*100)+'%')+'" onmouseenter="showChartTip(this,event)" onmouseleave="hideChartTip()" ontouchstart="showChartTip(this,event)" onclick="showChartTip(this,event)"/>';
    s+='<rect x="188" y="'+(y-9)+'" width="10" height="10" rx="3" fill="'+p.color+'"/>';
    s+='<text class="ax" x="204" y="'+y+'" font-size="10">'+esc(p.label)+' '+Math.round(p.val/total*100)+'%</text>';});
  return s+'</svg>';
}
/* ============ 每周学习周报 ============ */
function weekRange(offset){
  offset=offset||0;
  var d=new Date(),day=d.getDay()||7; /* 周一为周首 */
  d.setDate(d.getDate()-day+1+offset*7);
  var start=dstr(d);d.setDate(d.getDate()+6);
  return {start:start,end:dstr(d)};
}
function weekData(offset){
  var r=weekRange(offset),bySub={},total=0,pomo=0,activeDays=0;
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(r.start);d.setDate(d.getDate()+i);days.push(dstr(d));}
  days.forEach(function(day){
    var recs=sessionsOn(day),m=minutes(recs.reduce(function(a,s){return a+s.seconds;},0));
    total+=m;pomo+=pomodorosOn(day);if(m>0)activeDays++;
    recs.forEach(function(s){bySub[s.subjectId]=(bySub[s.subjectId]||0)+s.seconds;});
  });
  var parts=Object.keys(bySub).map(function(id){var sb=subjById(id);
    return {id:id,name:sb?sb.name:'未分类',color:sb?sb.color:C.ink2,min:minutes(bySub[id])};}).sort(function(a,b){return b.min-a.min;});
  var goalRate=S.goals.weeklyMinutes?Math.round(total/S.goals.weeklyMinutes*100):0;
  var wrong=S.mistakes.filter(function(m){return m.date>=r.start&&m.date<=r.end;})
    .reduce(function(a,m){return a+(m.wrong||0);},0);
  return {range:r,total:total,pomo:pomo,activeDays:activeDays,parts:parts,goalRate:goalRate,wrong:wrong};
}
var weekOffset=0;
function setWeekOffset(n){weekOffset=n;render();}
function genWeekAdvice(w){
  var top=w.parts[0]?w.parts[0].name:'—';
  var weak=w.parts.length>1?w.parts[w.parts.length-1].name:'—';
  var rateTxt=w.goalRate>=100?'已达成周目标，很好':(w.goalRate>=60?'接近目标，再加把劲':'离目标还有距离，注意安排时间');
  return '本周累计学习 <b>'+w.total+' 分钟</b>（'+w.pomo+' 个番茄），'+rateTxt+'。'+
    (top!=='—'?'<b>'+top+'</b> 投入最多':'')+(weak!=='—'?'，<b>'+weak+'</b> 相对薄弱，下周可适当补强':'')+'。'+
    (w.activeDays?'本周有 '+w.activeDays+' 天在学习，':'')+(w.activeDays>=5?'节奏很稳定，继续保持。':'试着让学习天数更连贯一些。');
}

/* 统计页题型选项：从当前选中科目（或全部）的真实错题 + 科目题型配置中提取 */
function statTypes(){
  var set={},out=[];
  if(statSubject){
    var sb=subjById(statSubject);
    if(sb&&sb.types)sb.types.forEach(function(t){if(t)set[t]=1;});
  }
  S.mistakes.forEach(function(m){
    if(statSubject&&m.subjectId!==statSubject)return;
    if(m.type)set[m.type]=1;});
  Object.keys(set).forEach(function(t){out.push(t);});
  return out.sort();
}
function statTypeOptions(){
  var h='<option value="">全部题型</option>';
  statTypes().forEach(function(t){h+='<option value="'+esc(t)+'"'+(t===statType?' selected':'')+'>'+esc(t)+'</option>';});
  return h;
}
function pickStatType(v){statType=v;render();}
function pageStats(){
  /* 统一筛选：科目 + 题型。错题类按题型，专注类按科目 */
  function mIn(m){return (!statSubject||m.subjectId===statSubject)&&(!statType||m.type===statType);}
  var mistakeSet=S.mistakes.filter(mIn);

  var days=[];
  for(var i=statRange-1;i>=0;i--){
    var day=shiftDay(-i),recs=sessionsOn(day,statSubject);
    var m=minutes(recs.reduce(function(a,s){return a+s.seconds;},0));
    days.push({label:day.slice(5).replace('-','/'),val:m,day:day});
  }
  var totalMin=days.reduce(function(a,d){return a+d.val;},0);
  var totalPomo=0,daysActive=0;
  for(var j=0;j<days.length;j++){
    totalPomo+=pomodorosOn(days[j].day,statSubject);
    if(days[j].val>0)daysActive++;
  }

  /* 科目占比 */
  var bySub={};S.sessions.forEach(function(s){if(statSubject&&s.subjectId!==statSubject)return;
    bySub[s.subjectId]=(bySub[s.subjectId]||0)+s.seconds;});
  var pie=Object.keys(bySub).map(function(id){var sb=subjById(id);return {label:sb?sb.name:'未分类',val:minutes(bySub[id]),color:sb?sb.color:C.ink2};}).sort(function(a,b){return b.val-a.val;});

  /* 错题分布 + 正确率：有题型维度时按题型分，否则按科目分 */
  var grp={};
  mistakeSet.forEach(function(m){
    var key=(statSubject||statType)?(m.type||'未分类'):(m.subjectId||'__none__');
    if(!grp[key])grp[key]={wrong:0,total:0};
    grp[key].wrong+=(m.wrong||0);grp[key].total+=(m.total||0);});
  function grpName(key){
    if(statSubject||statType)return key;
    if(key==='__none__')return '未分类';
    var sb=subjById(key);return sb?sb.name:'未分类';
  }
  function grpColor(key,idx){
    if(statSubject||statType)return PALETTE[idx%PALETTE.length].c;
    var sb=key==='__none__'?null:subjById(key);return sb?sb.color:C.ink2;
  }
  var grpKeys=Object.keys(grp);
  var wrongBars=grpKeys.map(function(k,i){return {label:grpName(k),val:grp[k].wrong,color:grpColor(k,i),unit:' 道'};});
  var accBars=grpKeys.map(function(k,i){return {label:grpName(k),val:grp[k].total?Math.round((1-grp[k].wrong/grp[k].total)*100):0,color:grpColor(k,i),unit:'%'};});

  /* 错题新增趋势：按日期聚合筛选后的错题 */
  var mistTrend=days.map(function(d){return {label:d.label,val:mistakesOn(d.day,statSubject,statType).length,unit:' 道'};});

  /* 番茄数 / 平均时长 */
  var pomoBars=days.map(function(d){return {label:d.label,val:pomodorosOn(d.day,statSubject),unit:' 个'};});
  var avgMin=daysActive?Math.round(totalMin/daysActive):0;

  /* 时段分布（环形用饼图） */
  var slots=[{label:'上午',val:0,color:C.dai},{label:'下午',val:0,color:C.dai2},
             {label:'傍晚',val:0,color:C.teng},{label:'深夜',val:0,color:C.zhu}];
  S.sessions.forEach(function(s){
    if(statSubject&&s.subjectId!==statSubject)return;
    var h=parseInt((s.time||'10:00').slice(0,2),10);
    if(h<12)slots[0].val+=s.seconds;else if(h<17)slots[1].val+=s.seconds;else if(h<21)slots[2].val+=s.seconds;else slots[3].val+=s.seconds;});
  slots.forEach(function(p){p.val=minutes(p.val);});

  /* 自动解读 */
  var topSub=pie[0]?pie[0].label:'—';
  var filterTxt=(statSubject?(subjById(statSubject)?subjById(statSubject).name:'未分类'):'全部科目')+(statType?' · '+statType:'');
  var insight='【'+esc(filterTxt)+'】近 '+statRange+' 天累计学习 <b>'+totalMin+' 分钟</b>（约 '+totalPomo+' 个番茄）'+
    (topSub!=='—'?'，<b>'+topSub+'</b> 用时最多':'')+
    (daysActive?'，平均每个学习日 <b>'+avgMin+' 分钟</b>':'')+'。';

  var grpLabel=(statSubject||statType)?'按题型':'按科目';
  return '<div class="page-head"><span class="back" onclick="back()">‹</span><span class="title">学习统计</span></div>'+
    '<div class="seg"><span class="s'+(statRange===7?' on':'')+'" onclick="setStatRange(7)">近 7 天</span>'+

/* 图片压缩到最长边 1600px，结果回填到目标框 */
function compressImg(input){
  var f=input.files&&input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1600,w=img.width,h=img.height;
      if(w>max||h>max){var r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.72);
      var box=document.getElementById((window.__imgTarget||'mImg')+'Box');
      if(box)box.innerHTML='<img class="big-img" src="'+data+'" style="max-height:120px">';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

/* 模拟 AI 回应：按关键词匹配模板，个人版不接真实 API */
function aiReply(chatId){
  var chat=S.chats.filter(function(c){return c.id===chatId;})[0];if(!chat)return;
  var last=chat.messages[chat.messages.length-1];
  var q=(last&&last.text)||'';
  var ans='';
  if(/主旨|中心|阅读/.test(q)){
    ans='**主旨概括题**可以这样解：\n1. 先看首句和尾句，中心句常在两端\n2. 找高频词，它往往指向主题\n3. 排除只概括局部、或以偏概全的选项\n\n记住：例子、数据、引用都是佐证，不是主旨。';
  }else if(/错题|复习|记不住/.test(q)){
    ans='错题要**按节奏复习**才有效：\n1. 当天弄懂错因和正解\n2. 按 1/3/7 天重做一遍\n3. 能独立讲清楚才算掌握\n\n在错题本里点「已复习」，我会自动帮你排下次复习时间。';
  }else if(/计划|安排|效率|拖延/.test(q)){
    ans='给你一个**专注安排建议**：\n1. 把最难的任务放在精力最好的时段\n2. 用 25 分钟番茄切分，中间休息 5 分钟\n3. 每天最多定 3 项必须完成的计划\n\n先完成最重要的那一件，比做满十条清单更有用。';
  }else if(/复盘|总结|进步/.test(q)){
    ans='一份好的**每日复盘**包含四部分：\n1. 完成情况：今天做了什么\n2. 困难不足：卡在哪里\n3. 改进措施：下次怎么做\n4. 明日重点：最重要的一件事\n\n坚持两周，你就能看到自己的进步轨迹。';
  }else{
    ans='我理解你想问的是「'+q.slice(0,20)+(q.length>20?'…':'')+'」。\n\n建议你先拆分问题，从最关键的一步入手。如果能告诉我具体科目或题型，我可以给更针对性的方法。\n\n（当前为本地模拟回应，配置真实 AI 接口后可获得完整能力）';
  }
  chat.messages.push({role:'ai',text:ans,time:nowClock()});
  save();render();scrollChat();
}

function onAIPresetChange(v){window.__aiPreset=v;loadAIPreset();}
function loadAIPreset(){
  syncAICfgDraft();
  var presets=(S.aiConfig&&S.aiConfig.presets)||[];
  var idx=window.__aiPreset===''?0:parseInt(window.__aiPreset,10);
  var p=presets[idx];
  if(!p){if(presets.length)toast('请选择一个预设');return;}
  window.__aiDraft={provider:p.provider||'',apiKey:p.apiKey||'',baseUrl:p.baseUrl||'',model:p.model||''};
  if(!p.models)p.models=[];
  S.aiConfig.models=(p.models||[]).slice();
  renderAICfgSheet();toast('已加载预设「'+(p.name||p.provider)+'」');
}
function saveAIPreset(){
  syncAICfgDraft();
  var d=window.__aiDraft;
  if(!d.provider){toast('请先填写供应商名称');return;}
  var cfg=S.aiConfig;cfg.presets=cfg.presets||[];
  var name=d.provider;
  var exist=cfg.presets.filter(function(p){return (p.name||p.provider)===name;})[0];
  var data={name:name,provider:d.provider,apiKey:d.apiKey,baseUrl:d.baseUrl,model:d.model,models:(cfg.models||[]).slice()};
  if(exist){var i=cfg.presets.indexOf(exist);cfg.presets[i]=data;window.__aiPreset=String(i);}
  else{cfg.presets.push(data);window.__aiPreset=String(cfg.presets.length-1);}
  save();renderAICfgSheet();toast(exist?'已更新预设':'已保存预设「'+name+'」');
}
function delAIPreset(){
  var presets=(S.aiConfig&&S.aiConfig.presets)||[];
  var idx=window.__aiPreset===''?0:parseInt(window.__aiPreset,10);
  var p=presets[idx];
  if(!p){toast('请选择一个预设');return;}
  confirmDo('删除预设「'+(p.name||p.provider)+'」？','只删除这个预设配置，不影响正常对话。',function(){
    S.aiConfig.presets.splice(idx,1);window.__aiPreset='';save();renderAICfgSheet();toast('已删除预设');
  });
}
function onAIModelSelect(v){var e=document.getElementById('cfgModel');if(e)e.value=v;}
function pullAIModels(btn){
  syncAICfgDraft();
  var d=window.__aiDraft;
  if(!d.baseUrl){toast('请先填写 Base URL');return;}
  var url=d.baseUrl.replace(/\/+$/,'')+'/models';
  if(btn){btn.textContent='拉取中…';btn.disabled=true;}
  var headers={};if(d.apiKey)headers['Authorization']='Bearer '+d.apiKey;
  fetch(url,{headers:headers}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){
      var ids=(j.data||[]).map(function(m){return m.id;}).filter(Boolean);
      if(!ids.length)throw new Error('返回列表为空');
      S.aiConfig.models=ids;save();
      renderAICfgSheet();toast('拉取到 '+ids.length+' 个模型');
    }).catch(function(err){
      if(btn){btn.textContent='拉取列表';btn.disabled=false;}
      toast('拉取失败：'+(err.message||'网络或跨域受限，请手动填写模型名'));
    });
}
function saveAICfg(){
  syncAICfgDraft();
  var d=window.__aiDraft||aiCfgBlank();
  var cfg=S.aiConfig||aiCfgBlank();
  cfg.provider=d.provider;cfg.apiKey=d.apiKey;cfg.baseUrl=d.baseUrl;cfg.model=d.model;

function importDataJSON(input){
  var f=input.files&&input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data||!data.subjects){toast('文件格式不对');return;}
      confirmDo('导入这份备份？','将用备份里的数据覆盖当前全部数据，建议先导出当前备份。',function(){
        S=migrate(data);save();render();toast('导入成功');});
    }catch(err){toast('文件格式不对');}
    input.value='';
  };
  reader.readAsText(f);
}

  if(!archMonth)archMonth=tree.length?tree[0].y+'-'+tree[0].ms[0]:today().slice(0,7);
  var cy=archMonth.slice(0,4),cm=archMonth.slice(5,7);
  var yNode=tree.filter(function(n){return n.y===cy;})[0];
  var months=yNode?yNode.ms:[cm];
  var list=ac.filter(function(a){return a.month===archMonth;});
  var plans=list.filter(function(a){return a.kind==='plan';});
  var goals=list.filter(function(a){return a.kind==='goal';});

  var yearPop=archOpenPop==='year'?
    '<div class="picker-pop arch-pop">'+(tree.length?tree.map(function(n){
      return '<div class="pi'+(n.y===cy?' sel':'')+'" onclick="setArchYear(\''+n.y+'\')">'+n.y+' 年'+(n.y===cy?'<span class="ck">✓</span>':'')+'</div>';
    }).join(''):'<div class="pi muted">暂无归档</div>')+'</div>':'';
  var monthPop=archOpenPop==='month'?
    '<div class="picker-pop arch-pop">'+months.map(function(m){
      return '<div class="pi'+(m===cm?' sel':'')+'" onclick="setArchMonth(\''+m+'\')">'+parseInt(m,10)+' 月'+(m===cm?'<span class="ck">✓</span>':'')+'</div>';
    }).join('')+'</div>':'';

  function archItem(a){
    return '<div class="todo-item"><span class="dot" style="background:'+(a.kind==='goal'?C.zhu:C.dai)+'"></span>'+
      '<span class="tt">'+esc(a.title)+'<br><span class="tiny muted">'+esc(a.detail)+'</span></span>'+
      '<span class="pg tiny">'+a.date.slice(5)+'</span>'+
      '<span class="arch-del" onclick="delArchive(\''+a.id+'\')">✕ 删除</span></div>';
  }
  return '<div class="page-head"><span class="back" onclick="back()">‹</span><span class="title">归档</span></div>'+
    '<div class="card"><div class="sec-title">筛选（年 / 月）</div>'+
      '<div class="arch-filter">'+
        '<div class="af-col"><div class="picker-anchor"><div class="picker-btn" onclick="toggleArchPop(\'year\')">'+
          '<span class="nm">'+cy+' 年</span><span class="arw">▼</span></div></div>'+yearPop+'</div>'+
        '<div class="af-col"><div class="picker-anchor"><div class="picker-btn" onclick="toggleArchPop(\'month\')">'+
          '<span class="nm">'+parseInt(cm,10)+' 月</span><span class="arw">▼</span></div></div>'+monthPop+'</div>'+
      '</div>'+
      '<div class="tiny muted" style="margin-top:8px">'+cy+' 年 '+parseInt(cm,10)+' 月 · 共 '+list.length+' 条归档</div></div>'+
    '<div class="card"><div class="sec-title">目标归档 <span class="more">'+goals.length+' 条</span></div>'+
      (goals.length?goals.map(archItem).join(''):'<div class="placeholder" style="padding:14px">该月暂无目标归档</div>')+'</div>'+
    '<div class="card"><div class="sec-title">计划归档 <span class="more">'+plans.length+' 条</span></div>'+
      (plans.length?plans.map(archItem).join(''):'<div class="placeholder" style="padding:14px">该月暂无计划归档</div>')+'</div>';
}
/* 导出学习数据：生成统计摘要，打印/另存为 PDF（浏览器打印对话框） */
function exportStudyPDF(){
  var days=[],i,m;
  for(i=6;i>=0;i--){days.push(shiftDay(-i));}
  var rows='';
  days.forEach(function(d){
    var mins=minutesOn(d);
    rows+='<tr><td style="padding:6px 8px;border-bottom:1px solid #E8DCC0">'+d+'</td><td style="padding:6px 8px;border-bottom:1px solid #E8DCC0;text-align:right">'+mins+' 分钟</td></tr>';
  });
  var srows='';
  S.subjects.forEach(function(s){srows+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #E8DCC0"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+s.color+'"></span> '+esc(s.name)+'</span><span>'+subjectWeekMin(s.id)+' 分钟 / 周</span></div>';});
  var summary='<div style="font-family:inherit;color:#2B2620;padding:8px">'+
    '<h2 style="color:#3D5A80;margin:0 0 4px">学习数据统计</h2>'+
    '<div style="font-size:12px;color:#7A7062;margin-bottom:12px">生成日期：'+today()+'</div>'+
    '<div style="display:flex;gap:20px;margin-bottom:16px;font-size:13px">'+
      '<div>今日 <b>'+todayMin()+'</b> 分 / 目标 '+S.goals.dailyMinutes+'</div>'+
      '<div>本周 <b>'+weekMin()+'</b> 分 / 目标 '+S.goals.weeklyMinutes+'</div>'+
      '<div>连续 <b style="color:#B93A26">'+streak()+'</b> 天</div></div>'+
    '<h3 style="font-size:13px;margin:12px 0 6px">近 7 天趋势</h3>'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px">'+rows+'</table>'+
    '<h3 style="font-size:13px;margin:16px 0 6px">分科目用时</h3>'+(srows||'<div class="muted">暂无科目</div>')+
    '</div>';
  sheet('导出学习数据 · PDF',
    '<div class="tiny muted" style="margin-bottom:10px">下面是学习统计摘要，点「导出 PDF」后在打印窗口选择「另存为 PDF」。</div>'+
    '<div style="border:1px solid '+C.line+';border-radius:10px;padding:10px;max-height:320px;overflow:auto">'+summary+'</div>',
    '<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn primary" onclick="doExportPDF()">导出 PDF</button>');
  window.__pdfHtml=summary;
}
function doExportPDF(){
  var w=window.open('','_blank');
  if(!w){toast('请允许弹窗以导出');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>学习数据统计</title>'+
    '<style>body{font-family:-apple-system,"Microsoft YaHei",sans-serif;padding:24px;max-width:640px;margin:0 auto}</style>'+
    '</head><body>'+window.__pdfHtml+'</body></html>');
  w.document.close();
  setTimeout(function(){w.print();},300);
  closeSheet();toast('已在新窗口打开，可另存为 PDF');
}

/* ============ 渲染主函数 ============ */
function render(){
  renderTabbar();
  var page=curPage(),html='';
  if(!page){
    if(R.tab==='home')html=pageHome();
    else if(R.tab==='focus')html=pageFocus();
    else if(R.tab==='plan')html=pagePlan();
    else html=pageMine();
  }else if(page==='goals')html=pageGoals();
  else if(page==='subjectDetail')html=pageSubjectDetail(R.stack[R.stack.length-1].arg);
  else if(page==='subjects')html=pageSubjects();
  else if(page==='stats')html=pageStats();
  else if(page==='weekly')html=pageWeekly();
  else if(page==='mistakes')html=pageMistakes();
  else if(page==='reviews')html=pageReviews();
  else if(page==='ai')html=pageAI();
  else if(page==='settings')html=pageSettings();
  else if(page==='archive')html=pageArchive();
  else html=simplePage('页面','');
  document.getElementById('screen').innerHTML=html;
  document.getElementById('screen').scrollTop=0;
  var mini=document.getElementById('miniTimer');
  if(T.running)mini.classList.add('show');else mini.classList.remove('show');
  updateTimerUI();
  updateStatusBar();
  if(page==='ai')scrollChat();
}
render();
/* 每分钟刷新状态栏时钟 */
setInterval(function(){var c=document.getElementById('clock');if(c)c.textContent=nowClock();},30000);
</script>
