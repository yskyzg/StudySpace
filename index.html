<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StudySpace</title>
<style>
:root{
  /* 澄净宣纸 · 精致化：保留书卷暖意，提亮提纯、拉开层次 */
  --paper:#F6F1E5; --paper2:#EFE8D6; --card:#FFFDF7; --line:#E9DFC9;
  --ink:#27221C; --ink2:#7C7263; --ink3:#A99E8C;
  --dai:#33577F; --dai-lt:#41699A; --dai2:#6C8BB0; --dai3:#E7EEF6;
  --zhu:#BE3E2B; --zhubg:#F7E4DC;
  --qing:#5E8C5B; --qingbg:#E7F0E4; --teng:#C4972C; --tengbg:#F8EED4; --zhe:#A9392A;
  --shadow:0 3px 16px rgba(74,54,22,.09);
  --shadow-lg:0 12px 34px rgba(60,44,18,.16);
  --r-card:18px; --r-btn:13px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color:var(--ink); background:var(--paper);
  min-height:100%; overscroll-behavior:none;
  font-size:13px;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 全屏 App 外壳 */
.phone{
  width:100%;height:100dvh;background:var(--paper);
  position:relative;display:flex;flex-direction:column;overflow:hidden;
}
.statusbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:11px;color:var(--ink2);background:var(--paper)}
.statusbar b{color:var(--ink)}
.mini-timer{display:none;flex:none;height:34px;align-items:center;gap:8px;
  padding:0 14px;background:var(--dai);color:#fff;font-size:12px;cursor:pointer}
.mini-timer.show{display:flex}
.mini-timer .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.mini-timer .t{margin-left:auto;font-weight:600;font-size:13px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 80px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,4px)}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--ink2);cursor:pointer;font-size:11px;min-height:56px}
.tabbar .tab.on{color:var(--dai)}
.tabbar .tab.on .ico{stroke:var(--dai)}
.tabbar .ico{width:24px;height:24px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 通用 */
.page-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px;min-height:40px}
.page-head .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--dai);font-size:24px;flex:none;border-radius:10px}
.page-head .title{font-size:16px;font-weight:600;flex:1;text-align:center;margin-right:40px}
.hero-title{font-size:20px;font-weight:600;color:var(--dai);margin:4px 0 2px}
.hero-sub{font-size:11.5px;color:var(--ink2);margin-bottom:14px}
/* 页面主操作固定在内容顶部，条目再多也不用翻到底 */
.page-actions{display:flex;gap:8px;margin:0 0 12px;padding:6px 0;position:sticky;top:0;z-index:8;
  background:linear-gradient(180deg,var(--paper) 72%,rgba(246,241,229,0))}
.page-actions .btn{flex:1 1 0;min-width:0;padding:0 10px;min-height:42px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sec-title{font-size:14px;font-weight:600;margin:2px 0 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title .more{font-size:11.5px;color:var(--dai);font-weight:400;cursor:pointer}
.muted{color:var(--ink2)}
.tiny{font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;align-items:center;gap:10px}
.btn{border:none;border-radius:var(--r-btn);min-height:44px;padding:0 16px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--dai);color:#fff}
.btn.primary:active{background:#34507a}
.btn.ghost{background:var(--card);color:var(--dai);border:1px solid var(--dai)}
.btn.danger{background:var(--zhe);color:#fff}
.btn.sm{min-height:36px;font-size:12.5px;padding:0 12px}
.btn.block{width:100%}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:38px;border:none;background:var(--card);color:var(--dai);
  font-size:20px;cursor:pointer;font-family:inherit}
.stepper .v{min-width:48px;text-align:center;font-weight:600;font-size:14px}
.stepper input.v{border:none;background:transparent;width:56px;padding:0;color:var(--ink);
  font-family:inherit;font-weight:600;font-size:14px;-moz-appearance:textfield}
.stepper input.v::-webkit-inner-spin-button,.stepper input.v::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* 首页 */
.goal-card{background:var(--dai);color:#fff;border-radius:var(--r-card);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden}
.goal-card.done{box-shadow:inset 0 0 0 2px var(--zhu)}
.goal-card .lab{font-size:12px;opacity:.85}
.goal-card .big{font-size:30px;font-weight:600;margin:6px 0 2px}
.goal-card .big small{font-size:14px;font-weight:400;opacity:.85}
div.bar{height:8px;background:rgba(255,255,255,.28);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .35s ease}
.goal-card .foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;margin-top:7px}
.kpi{display:flex;gap:12px;margin-bottom:12px}
.kpi .card{flex:1;margin:0;padding:14px}
.kpi .n{font-size:24px;font-weight:600;margin-top:4px}
.kpi .n.red{color:var(--zhu)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.chk{width:22px;height:22px;border:2px solid var(--dai2);border-radius:7px;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.chk.on{background:var(--qing);border-color:var(--qing)}
.todo-item.done .tt{text-decoration:line-through;color:var(--ink2)}
.todo-item .tt{flex:1;font-size:13px}
.todo-item .pg{font-size:12px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars .b .col{width:100%;background:var(--dai2);border-radius:5px 5px 0 0;min-height:3px;transition:height .3s}
.bars .b.today .col{background:var(--dai)}
.bars .b .lb{font-size:9.5px;color:var(--ink2)}
.ai-tip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.6}
.ai-tip .hd{color:var(--dai);font-weight:600;margin-bottom:4px;font-size:12px}
.empty{text-align:center;padding:40px 16px;color:var(--ink2)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.5}
.empty .btn{margin-top:16px}

/* 专注页 */
.mode-switch{display:flex;gap:8px;margin-bottom:14px}
.mode-switch .m{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);cursor:pointer;font-size:12.5px;color:var(--ink2)}
.mode-switch .m.on{background:var(--dai3);border-color:var(--dai);color:var(--dai);font-weight:600}
.dial-wrap{position:relative;width:250px;height:250px;margin:6px auto 10px}
.dial{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:#E6DCC4;stroke-width:13}
.dial .prog{fill:none;stroke:var(--dai);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.dial-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial-center .phase{font-size:12px;color:var(--ink2)}
.dial-center .time{font-size:46px;font-weight:600;letter-spacing:1px;margin:2px 0}
.dial-center .subj{font-size:12px;color:var(--dai);display:flex;align-items:center;gap:6px}
.dial-center .total{font-size:11px;color:var(--zhu);margin-top:1px;min-height:14px}
.dial-center.over .phase{color:var(--zhu);font-weight:600}
.dial-center.over .time{color:var(--zhu);font-size:40px}
.focus-actions{display:flex;gap:10px;margin-bottom:8px}
.focus-actions .btn{flex:1 1 0;min-width:0;padding:0 8px}
.record-link{display:block;text-align:center;color:var(--dai);font-size:12px;padding:8px;cursor:pointer}
.fold-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}
.fold-head .arw{color:var(--ink2);transition:transform .2s}
.fold-head.open .arw{transform:rotate(90deg)}
.fold-body{display:none;padding-top:12px}
.fold-body.open{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.dist .b{margin-bottom:8px}
.dist .b .lb{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.dist .b .track{height:8px;background:#EFE7D2;border-radius:6px;overflow:hidden}
.dist .b .track>i{display:block;height:100%;border-radius:6px}

/* 下拉框：统一组件 —— 锚点内浮层，跟随滚动、不再脱离 */
.picker-anchor{width:100%;position:relative;z-index:2}
.picker-anchor.open{z-index:140}
.picker-btn{width:100%;height:46px;border:1px solid var(--line);background:#fff;border-radius:var(--r-btn);
  display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;font-size:13.5px;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:border-color .15s,box-shadow .15s}
.picker-btn:active{border-color:var(--dai);box-shadow:0 0 0 3px rgba(61,90,128,.12)}
.picker-btn .arw{margin-left:auto;color:var(--ink2);font-size:10px;transition:transform .18s}
.picker-anchor.open .picker-btn{border-color:var(--dai);box-shadow:0 0 0 3px rgba(61,90,128,.12)}
.picker-anchor.open .picker-btn .arw{transform:rotate(180deg)}
.picker-btn .nm{flex:1;text-align:left}
.picker-pop{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;width:max-content;max-width:92vw;
  z-index:130;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 10px 30px rgba(60,40,10,.22);overflow:auto;max-height:280px;
  animation:popIn .14s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.picker-pop .pi{display:flex;align-items:center;gap:9px;padding:12px 14px;min-height:44px;box-sizing:border-box;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
.picker-pop .pi:last-child{border-bottom:none}
.picker-pop .pi:active{background:var(--dai3)}
.picker-pop .pi.sel{background:var(--dai3);color:var(--dai);font-weight:600}
.picker-pop .pi.new{color:var(--dai);font-weight:600;border-top:1px solid var(--line)}
.picker-pop .pi .ck{margin-left:auto}
/* 紧凑下拉（seg / 工具栏内），按钮沿用 .s 外观，浮层复用 .picker-pop */
.seg .picker-anchor{width:auto;flex:1;min-width:0}
.seg .s.pk-trigger{position:relative;padding-right:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .s.pk-trigger::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink2)}
.seg .picker-anchor.open .s,.seg .s.pk-trigger.open{background:var(--dai3);border-color:var(--dai);color:var(--dai);font-weight:600}
.seg .picker-anchor.open .s::after,.seg .s.pk-trigger.open::after{color:var(--dai);transform:translateY(-50%) rotate(180deg)}

/* 目标页 */
.rings{display:flex;gap:10px;margin-bottom:12px}
.ring-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px;box-shadow:var(--shadow);text-align:center}
.ring-card svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring-card .track{fill:none;stroke:#EFE7D2;stroke-width:10}
.ring-card .prog{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-card .lbl{font-size:12px;color:var(--ink2);margin-top:2px}
.ring-card .val{font-size:11px;color:var(--ink2);margin-top:2px}
.ring-num{font-size:19px;font-weight:600}
.subj-prog{margin-bottom:14px}
.subj-prog .top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:6px;cursor:pointer}
.subj-prog .track{height:10px;background:#EFE7D2;border-radius:6px;overflow:hidden}
.subj-prog .track>i{display:block;height:100%;border-radius:6px;transition:width .35s}
.subj-prog.unset .track>i{opacity:.35}
.badge-unset{font-size:10px;color:var(--ink2);background:#EFE7D2;border-radius:20px;padding:1px 8px}
.badge-del{font-size:10px;color:var(--zhe);background:var(--zhubg);border-radius:20px;padding:2px 9px;cursor:pointer}
.month-chips{display:flex;flex-wrap:wrap;gap:8px}
.month-chip{font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink2);background:#fff}
.month-chip.on{background:var(--dai);border-color:var(--dai);color:#fff;font-weight:600}
.arch-filter{display:flex;gap:10px}
.arch-filter .af-col{flex:1;min-width:0}
.arch-filter .picker-btn{height:44px}
.arch-pop{position:static;width:100%;margin-top:4px;max-height:230px;overflow:auto}
.arch-del{font-size:10px;color:var(--zhe);background:var(--zhubg);border-radius:20px;padding:2px 9px;cursor:pointer;margin-left:8px;white-space:nowrap}
.goal-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal-row:last-child{border-bottom:none}
.goal-row .nm{flex:1;font-size:13px;display:flex;align-items:center;gap:8px}
.goal-row .stepper button{width:32px;height:32px}
.goal-row .stepper .v{min-width:42px;font-size:12.5px}

/* 我的 */
.mine-head{background:var(--dai);border-radius:var(--r-card);padding:18px;color:#fff;margin-bottom:12px}
.mine-head .nm{font-size:17px;font-weight:600}
.mine-head .gs{font-size:12px;opacity:.9;margin-top:6px}
.menu-group{margin-bottom:12px}
.menu-group .gt{font-size:11.5px;color:var(--ink2);padding:4px 6px 6px}
.menu-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  padding:14px 16px;cursor:pointer;font-size:13.5px}
.menu-item:first-of-type{border-radius:12px 12px 0 0}
.menu-item:last-child{border-radius:0 0 12px 12px}
.menu-item + .menu-item{border-top:none}
.menu-item .ic{width:22px;height:22px;stroke:var(--dai);fill:none;stroke-width:1.7}
.menu-item .arw{margin-left:auto;color:var(--ink2)}

/* 科目管理 */
.subj-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.subj-item:last-child{border-bottom:none}
.subj-item .nm{flex:1;font-size:13.5px}
.subj-item .types{font-size:11px;color:var(--ink2)}
.subj-item .edit{font-size:12px;color:var(--dai);cursor:pointer;padding:6px}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 4px}
.color-grid .c{aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-grid .c.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(30,22,10,.45);z-index:100;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet .sh .t{font-size:15px;font-weight:600;color:var(--dai)}
.sheet .sh .x{font-size:20px;color:var(--ink2);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
.fld input,.fld select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;
  padding:0 12px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
.sheet-foot{display:flex;gap:10px;margin-top:18px}
.sheet-foot .btn{flex:1}
.confirm{max-width:320px;width:calc(100% - 40px);background:var(--card);border-radius:16px;
  padding:20px;margin:auto;box-shadow:var(--shadow);align-self:center}
.confirm .t{font-size:15px;font-weight:600;margin-bottom:8px}
.confirm .d{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
/* 前台到点提醒弹窗（不依赖系统通知，息屏回前台/前台都能看到） */
.alert-mask{position:fixed;inset:0;background:rgba(30,22,10,.5);z-index:150;display:flex;
  align-items:center;justify-content:center;animation:fadeIn .2s}
.alert-box{width:calc(100% - 56px);max-width:340px;background:var(--card);border-radius:18px;
  padding:22px 20px 18px;text-align:center;box-shadow:0 16px 48px rgba(30,22,10,.3)}
.alert-box .em{font-size:38px;line-height:1;margin-bottom:8px}
.alert-box .t{font-size:17px;font-weight:600;color:var(--dai);margin-bottom:6px}
.alert-box .d{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
.alert-box .row2{display:flex;gap:10px}
.alert-box .row2 .btn{flex:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* 设置分组内的开关行 */
.set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1;color:var(--ink)}
.set-row .lbl small{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px}
.sw{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--dai)}
.sw.on::after{left:22px}
.set-sub{padding:2px 14px 12px;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;
  z-index:200;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.placeholder{text-align:center;color:var(--ink2);padding:30px 16px;font-size:12.5px;line-height:1.8}
.placeholder .big{font-size:26px;margin-bottom:8px}
/* ===== 统计图表 ===== */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg .s{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);cursor:pointer;font-size:12px;color:var(--ink2)}
.seg .s.on{background:var(--dai3);border-color:var(--dai);color:var(--dai);font-weight:600}
.chart-svg{width:100%;height:170px;display:block}
.chart-svg .grid{stroke:var(--line);stroke-width:1}
.chart-svg .ln{fill:none;stroke:var(--dai);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .pt{fill:var(--dai)}
.chart-svg .ax{fill:var(--ink2);font-size:9px}
.chart-svg .bar{fill:var(--dai2)}
.chart-svg .bar.today{fill:var(--dai)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.insight{background:var(--dai3);border-radius:10px;padding:10px 12px;font-size:12px;
  color:var(--dai);line-height:1.65;margin-top:10px}
.insight b{font-weight:600}

/* ===== 错题本 ===== */
.mist-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer}
.mist-card .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mist-card .tag{font-size:10px;background:var(--dai3);color:var(--dai);border-radius:20px;padding:2px 8px}
.mist-card .rate{margin-left:auto;font-size:11px;color:var(--zhe);font-weight:600}
.mist-card .ttl{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:6px}
.mist-card .kv{font-size:11.5px;color:var(--ink2);line-height:1.7}
.mist-card .thumbs{display:flex;gap:6px;margin-top:8px}
.mist-card .thumbs img,.mist-card .thumbs .ph{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#EFE7D2}
.mist-card .thumbs .ph{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
.mist-card .due{font-size:10.5px;color:var(--zhu);margin-top:6px}
/* 批量模式：勾选框 + 选中高亮，选了什么一眼可见 */
.mist-card.batch{display:flex;gap:10px;align-items:flex-start}
.mist-card .body{flex:1;min-width:0}
.mist-card.sel{border-color:var(--dai);background:var(--dai3);box-shadow:0 0 0 2px rgba(61,90,128,.14)}
.mist-check{flex:none;width:22px;height:22px;margin-top:2px;border:1.5px solid var(--line);border-radius:7px;
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  color:transparent;user-select:none}
.mist-card.sel .mist-check{background:var(--dai);border-color:var(--dai);color:#fff}
.export-path{font-size:12px;word-break:break-all;background:var(--dai3);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;color:var(--ink);line-height:1.55}
.big-img{width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
.kv-block{margin-bottom:12px}
.kv-block .k{font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.kv-block .v{font-size:13px;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.pill{display:inline-block;font-size:10.5px;background:var(--dai3);color:var(--dai);border-radius:20px;padding:3px 10px;margin:0 6px 6px 0}

/* ===== 复盘 ===== */
.review-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer}
.review-card .d{font-size:11px;color:var(--ink2);margin-bottom:5px}
.review-card .t{font-size:13px;line-height:1.6}
.sec-box{margin-bottom:14px}
.sec-box label{display:block;font-size:12px;font-weight:600;color:var(--dai);margin-bottom:6px}
.sec-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);resize:vertical;line-height:1.6}
.auto-sum{background:var(--dai3);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--ink);line-height:1.8;margin-bottom:14px}
.auto-sum b{color:var(--dai)}

/* ===== AI 助手 ===== */
/* 对话页占满可视高度：消息区滚动，输入区固定底部，长对话也不顶飞输入框 */
.screen.chat-mode{display:flex;flex-direction:column;overflow:hidden;padding:8px 16px calc(64px + env(safe-area-inset-bottom,0px));min-height:0}
.chat-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:10px 4px 16px 2px}
.msg{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.msg .av{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#fff;background:var(--dai)}
.msg.ai .av{background:var(--qing)}
.msg .bubble{max-width:calc(100% - 44px);padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--dai);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .bubble b{font-weight:600}
.chat-input{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--paper);margin-top:0}
.chat-input textarea{flex:1;min-width:0;min-height:44px;max-height:110px;border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);resize:none;line-height:1.5}
.chat-input textarea:focus{outline:none;border-color:var(--dai);box-shadow:0 0 0 3px rgba(61,90,128,.12)}
.sess-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sess-item .ic{width:18px;height:18px;stroke:var(--dai);fill:none;stroke-width:1.7;flex:none}
.sess-item .nm{flex:1;font-size:13px}
.sess-item .del{font-size:11px;color:var(--zhe);padding:6px}
/* AI 助手：提示词栏 / 引导条 / 上下文条 / 外链工具 / 消息内图片 */
.ai-bar{display:flex;align-items:center;gap:6px;flex:none;margin-bottom:6px}
.ai-bar .label{font-size:11px;color:var(--ink2);flex:none}
.ai-bar select{flex:1;min-width:0;font-size:12px;padding:7px 8px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--dai);font-weight:600;font-family:inherit}
.ai-bar .btn{flex:none}
.ai-guide{background:var(--dai3);border-radius:9px;padding:8px 11px;font-size:11.5px;
  color:var(--dai);line-height:1.6;flex:none;margin-bottom:6px}
.ai-guide span{text-decoration:underline;cursor:pointer}
.ai-ctx{display:flex;align-items:center;gap:8px;flex:none;margin-bottom:6px;font-size:11px;color:var(--ink2)}
.ai-ctx span{color:var(--dai);cursor:pointer;text-decoration:underline}
/* 提示词预设：卡片式列表，默认项高亮 */
.pr-head{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);
  padding:0 4px 6px;border-bottom:1px solid var(--line)}
.pr-row{display:flex;align-items:center;gap:8px;padding:10px 9px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
.pr-row.def{border-color:var(--dai2);background:var(--dai3)}
.pr-row .n{flex:1;min-width:0}
.pr-row .n b{font-size:12.5px;font-weight:600}
.pr-row .n em{font-style:normal;font-size:10px;color:var(--dai);background:#fff;
  border:1px solid var(--dai2);border-radius:20px;padding:1px 7px;margin-left:6px}
.pr-row .n small{display:block;font-size:10.5px;color:var(--ink2);line-height:1.5;
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-row .d{font-size:11px;color:var(--dai);cursor:pointer;padding:4px 6px;border-left:1px solid var(--line)}
.sess-item .pn{font-size:10px;color:var(--ink2);background:var(--dai3);border-radius:20px;
  padding:2px 7px;flex:none;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .bubble img{max-width:100%;border-radius:8px;margin-top:8px;display:block;border:1px solid var(--line)}
/* 智能提醒：展开后的多条建议 */
.tip-list{margin-top:8px}
.tip-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.tip-row:last-child{border-bottom:0}
.tip-row .t{flex:1;font-size:12px;line-height:1.65}
.tip-row .go{font-size:11px;color:var(--dai);cursor:pointer;flex:none;padding-top:1px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ext-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;text-align:center;cursor:pointer}
.ext-card b{display:block;color:var(--dai);font-size:13px;margin-bottom:2px}

/* 计划月历 */
.cal-nav{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--dai);font-size:12px;white-space:nowrap}
.cal-nav b{font-size:14px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-w{text-align:center;font-size:10px;color:var(--ink2);padding:2px 0}
.cal-d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11.5px;cursor:pointer;border:1px solid transparent;position:relative}
.cal-d:active{background:var(--dai3)}
.cal-d.blank{cursor:default}
.cal-d.today{background:var(--dai);color:#fff;font-weight:600}
.cal-d.has{border-color:var(--line)}
.cal-d .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:2px;justify-content:center}
.cal-d .dots i{width:5px;height:5px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.cal-d.today .dots i{box-shadow:0 0 0 1px rgba(61,90,128,.9)}
.cal-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:10px;color:var(--ink2)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend i{width:7px;height:7px;border-radius:50%}
/* 打卡月历：复用计划月历网格，按打卡状态着色 */
.cal-d.checked{background:var(--dai3);border-color:#CBD9EA}
.cal-d.hit{background:var(--zhubg);border-color:#E7BDB0}
.cal-d.checked.today{background:var(--dai);color:#fff;border-color:var(--dai)}
.cal-d.hit.today{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.cal-hint{font-size:10.5px;color:var(--ink2);line-height:1.65;margin-top:9px;text-align:center}
.cal-detail{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);margin-bottom:10px}
.cal-detail .n{font-size:19px;font-weight:600;color:var(--dai)}
.cal-detail .l{font-size:11px;color:var(--ink2);line-height:1.6}
/* 图表悬浮/触摸提示 */
#chartTip{position:fixed;z-index:400;pointer-events:none;background:var(--ink);color:#fff;
  font-size:12px;line-height:1.5;padding:7px 11px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.22);
  white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .12s}
#chartTip.on{opacity:1}
.chart-svg .hit{cursor:pointer}
.bar,.pt,.chart-svg path{transition:opacity .12s}
.bar:hover,.bar:active,.chart-svg path:hover,.chart-svg path:active{opacity:.78}

/* ===== 周报 ===== */
.week-hero{background:var(--dai);color:#fff;border-radius:var(--r-card);padding:18px;margin-bottom:12px}
.week-hero .t{font-size:12px;opacity:.85}
.week-hero .n{font-size:32px;font-weight:600;margin:6px 0 2px}
.week-hero .sub{font-size:11.5px;opacity:.9}
.week-stat{display:flex;gap:10px;margin-bottom:12px}
.week-stat .w{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.week-stat .w .n{font-size:19px;font-weight:600;color:var(--dai)}
.week-stat .w .l{font-size:11px;color:var(--ink2);margin-top:3px}

/* ============ 精致化增强层 ============ */
/* 宣纸质感背景：极淡的双层径向光晕，避免大面积死板平涂 */
.phone{
  background:
    radial-gradient(120% 60% at 12% -8%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(90% 50% at 100% 0%,rgba(196,151,44,.055),transparent 55%),
    var(--paper);
}
/* 卡片：更柔的层次与圆角，轻微顶高光 */
.card,.ring-card,.mist-card,.review-card{
  border-color:var(--line);
  background:linear-gradient(180deg,#FFFEFB 0%,var(--card) 42%);
  box-shadow:var(--shadow);
}
/* 主色块渐变：首页目标卡 / 我的头部 / 周报头 通用提质感 */
.goal-card,.mine-head,.week-hero{background:linear-gradient(135deg,var(--dai-lt),var(--dai) 70%);}
.goal-card.done{background:linear-gradient(135deg,var(--teng),#A9781F);}
/* 主按钮：渐变 + 柔和投影 + 按压反馈 */
.btn.primary{
  background:linear-gradient(180deg,var(--dai-lt),var(--dai));
  box-shadow:0 4px 12px rgba(51,87,127,.28);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .12s;
}
.btn.primary:active{transform:translateY(1px) scale(.985);box-shadow:0 2px 6px rgba(51,87,127,.24);filter:brightness(.96)}
.btn.ghost,.btn.sm{transition:transform .12s var(--ease),background .12s}
.btn:active{transform:translateY(1px)}
/* 分段控件 / 模式切换：选中态更立体 */
.seg .s.on,.mode-switch .m.on{box-shadow:0 2px 8px rgba(51,87,127,.16)}
/* Tab 栏：毛玻璃 + 激活顶部指示条 */
.tabbar{background:rgba(255,253,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabbar .tab{position:relative}
.tabbar .tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--dai)}
.tabbar .tab.on .ico{stroke-width:2.1}
/* 关键数字：更现代的字重与字距 */
.kpi .n,.week-stat .w .n,.goal-card .big{letter-spacing:-.5px}
/* 标题字色加深，辅助字色微调，层级更清晰 */
.hero-title,.page-head .title,.sec-title{color:var(--ink)}
/* 页面入场：轻微上浮淡入，不喧宾夺主 */
.screen>*:not(.chat-wrap){animation:fadeUp .28s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 尊重系统「减少动态」设置 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
/* 全屏 App：大屏时内容居中限宽，保持手机阅读宽度 */
@media(min-width:560px){
  .phone{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(60,40,10,.12)}
  .mask .sheet{max-width:480px}
}
</style>

<div class="phone">
  <div class="mini-timer" id="miniTimer" onclick="goTab('focus')">
    <span class="dot" id="miniDot"></span><span id="miniName">专注中</span>
    <span class="t num" id="miniTime">25:00</span><span>›</span>
  </div>
  <div class="screen" id="screen"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheetRoot"></div>
<div id="confirmRoot"></div>
<div id="alertRoot"></div>
<div id="toast"></div>

<script>
/* ============ 全局常量 ============ */
var KEY='studywr_app_v1';
var KEY_BAK='studywr_app_v1_bak';
var KEY_META='studywr_app_v1_meta';
var PALETTE=[
  {n:'黛蓝',c:'#3D5A80'},{n:'朱红',c:'#B93A26'},{n:'竹青',c:'#6B8E5A'},{n:'藤黄',c:'#C99A2E'},
  {n:'紫檀',c:'#7A4B6B'},{n:'月青',c:'#5B9A9A'},{n:'赭石',c:'#A65D3E'},{n:'松绿',c:'#4F7A5B'},
  {n:'秋香',c:'#9C8A3C'},{n:'胭脂',c:'#9D2933'},{n:'靛青',c:'#2B6B8F'},{n:'茶褐',c:'#7B5E42'}
];
var C={paper:'#F6F1E5',paper2:'#EFE8D6',card:'#FFFDF7',line:'#E9DFC9',ink:'#27221C',ink2:'#7C7263',ink3:'#A99E8C',
  dai:'#33577F',daiLt:'#41699A',dai2:'#6C8BB0',zhu:'#BE3E2B',qing:'#5E8C5B',teng:'#C4972C',zhe:'#A9392A'};

/* ============ 日期工具 ============ */
function dstr(d){var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+dd;}
function shiftDay(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d);}
function today(){return dstr(new Date());}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function minutes(sec){return Math.round(sec/60);}
/* 时长显示：精确到秒，保留原始秒数（不再四舍五入丢秒） */
function fmtDur(sec){
  sec=Math.max(0,Math.floor(Number(sec)||0));
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h)return h+' 小时 '+m+' 分 '+s+' 秒';
  if(m)return m+' 分 '+s+' 秒';
  return s+' 秒';
}
function fmtClock(sec){
  sec=Math.max(0,Math.floor(Number(sec)||0));
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return (h?h+':':'')+('0'+m).slice(-2)+':'+('0'+s).slice(-2);
}
/* 状态栏：真实时钟 + 累计学习天数 */
function nowClock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
function studyDays(){
  var days={};(S.sessions||[]).forEach(function(s){if(s.date)days[s.date]=1;});
  return Math.max(1,Object.keys(days).length);
}
function updateStatusBar(){
  var c=document.getElementById('clock');if(c)c.textContent=nowClock();
  var d=document.getElementById('dayCount');if(d)d.textContent=studyDays();
}

/* 内置提示词：首次安装直接带这套，之后完全由用户增删改 */
var AI_PROMPTS_DEFAULT=[
  {name:'考公解题助手',text:'你是公考 / 事业单位考试辅导老师。按「审题 → 考点 → 解题步骤 → 易错提醒」四步讲解，简明、有条理。'},
  {name:'错题讲解',text:'你是耐心的学科老师。结合错题的错因和知识点讲清解题思路，指出同类题的通用方法，最后给一道变式练习。'},
  {name:'复盘顾问',text:'你是学习复盘顾问。基于用户的专注与错题数据，指出最值得改进的一点，给出明天可执行的三条建议。'},
  {name:'计划助手',text:'你是学习计划助手。把大任务拆成今天可完成的番茄清单，按优先级排序，每项不超过 25 分钟。'}
];
function aiCfgBlank(){
  return {provider:'',apiKey:'',baseUrl:'',model:'',presets:[],models:[],defaultPrompt:'',
    prompts:AI_PROMPTS_DEFAULT.map(function(p){return {name:p.name,text:p.text};})};
}
function aiPrompts(){
  var p=(S.aiConfig&&S.aiConfig.prompts)||[];
  return p.length?p:AI_PROMPTS_DEFAULT;
}
/* 提示词库是全局预设；每个会话各存一个 promptName，互不干扰 */
function getChatPrompt(chat){
  var ps=aiPrompts();
  for(var i=0;i<ps.length;i++)if(ps[i].name===(chat&&chat.promptName))return ps[i];
  for(var j=0;j<ps.length;j++)if(ps[j].name===((S.aiConfig||{}).defaultPrompt))return ps[j];
  return ps[0]||{name:'',text:''};
}
function setChatPrompt(name){

   endAgainOnManual：倒计时到点已响过一次后，再主动点「结束并记录」是否重响 */
function soundCfgBlank(){

          end:{on:false,name:'system',data:''},
          fifteen:{on:false,name:'system',data:''},
          five:{on:false,name:'system',data:''},

/* 迁移容错：老数据缺字段时补齐，保证升级不报错、不丢数据 */
function migrate(s){
  if(!s||!s.subjects)return s;
  s.plans=s.plans||[];s.sessions=s.sessions||[];s.mistakes=s.mistakes||[];
  s.reviews=s.reviews||[];s.chats=s.chats||[];s.archives=s.archives||[];
  s.weeklyReports=s.weeklyReports||[];s.subjectGoals=s.subjectGoals||{};
  s.profile=s.profile||{nickname:'学习者',purpose:''};
  s.aiConfig=s.aiConfig||aiCfgBlank();
  s.soundCfg=s.soundCfg||soundCfgBlank();
  ['start','end','fifteen','five'].forEach(function(k){
    var d=s.soundCfg[k]||{};
    s.soundCfg[k]={on:!!d.on,name:d.name||'system',data:d.data||''};
  });
  s.soundCfg.endAgainOnManual=!!s.soundCfg.endAgainOnManual;
  if(!s.aiConfig.presets)s.aiConfig.presets=[];
  if(!s.aiConfig.models)s.aiConfig.models=[];
  if(!s.aiConfig.prompts||!s.aiConfig.prompts.length)
    s.aiConfig.prompts=AI_PROMPTS_DEFAULT.map(function(p){return {name:p.name,text:p.text};});
  if(typeof s.aiConfig.defaultPrompt!=='string')s.aiConfig.defaultPrompt='';
  s.mistakes.forEach(function(m){
    m.type=m.type||'';m.reason=m.reason||'';m.answer=m.answer||'';
    m.knowledge=m.knowledge||[];m.img=m.img||'';m.answerImg=m.answerImg||'';
    m.nextReview=m.nextReview||m.date||today();m.stage=m.stage||0;m.reviewed=m.reviewed||0;
  });
  s.reviews.forEach(function(r){r.subjects=r.subjects||[];});
  return s;
}
/* 读取单个存储槽：解析失败返回 null，绝不在此覆盖原始数据 */
function readSlot(k){
  try{var raw=localStorage.getItem(k);if(!raw)return null;var s=JSON.parse(raw);
    return (s&&Array.isArray(s.subjects))?s:null;}catch(e){return null;}
}
function load(){
  /* 主槽优先，损坏则从影子备份恢复；两个槽都解析失败时保留原始数据不覆盖 */
  var s=readSlot(KEY)||readSlot(KEY_BAK);
  if(s){try{return migrate(s);}catch(e){return s;}}
  var d=makeEmpty();
  try{
    if(localStorage.getItem(KEY)==null&&localStorage.getItem(KEY_BAK)==null){
      localStorage.setItem(KEY,JSON.stringify(d));localStorage.setItem(KEY_BAK,JSON.stringify(d));
    }
  }catch(e){}
  return d;
}
function save(){
  var json;try{json=JSON.stringify(S);}catch(e){return;}
  try{localStorage.setItem(KEY,json);}catch(e){}
  try{localStorage.setItem(KEY_BAK,json);}catch(e){}
  try{localStorage.setItem(KEY_META,JSON.stringify({t:Date.now()}));}catch(e){}
}

/* 统计：可选 subjectId 过滤，不传则为全体科目 */
function sessionsOn(day,subjectId){return S.sessions.filter(function(s){return s.date===day&&(!subjectId||s.subjectId===subjectId);});}
function secondsOn(day,subjectId){return sessionsOn(day,subjectId).reduce(function(a,s){return a+(s.seconds||0);},0);}
function minutesOn(day,subjectId){return minutes(secondsOn(day,subjectId));}
function pomodorosOn(day,subjectId){return sessionsOn(day,subjectId).reduce(function(a,s){return a+(s.pomodoros||1);},0);}
/* 某天某科（可选）新增错题数，可选题型过滤 */
function mistakesOn(day,subjectId,type){return S.mistakes.filter(function(m){
  return m.date===day&&(!subjectId||m.subjectId===subjectId)&&(!type||m.type===type);});}
function todaySec(){return secondsOn(today());}
function todayMin(){return minutes(todaySec());}
function weekSec(){var t=0;for(var i=0;i<7;i++)t+=secondsOn(shiftDay(-i));return t;}
function weekMin(){return minutes(weekSec());}
function streak(){
  var n=0;for(var i=0;i<400;i++){if(secondsOn(shiftDay(-i))>0)n++;else{if(i===0)continue;break;}}return n;
}
/* 打卡判定：当天有专注记录即打卡；达日目标额外标红。
   计划完成、错题复习不计入打卡；今天未计时不算断。 */
function checkinMeta(day){
  var sec=secondsOn(day),goal=(S.goals&&S.goals.dailyMinutes)||0;
  return {sec:sec,checked:sec>0,goalMet:sec>0&&goal>0&&sec>=goal*60};
}
function subjectSec(id,day){return sessionsOn(day).filter(function(s){return s.subjectId===id;}).reduce(function(a,s){return a+(s.seconds||0);},0);}
function subjectMin(id,day){return minutes(subjectSec(id,day));}
function subjectWeekSec(id){var t=0;for(var i=0;i<7;i++)t+=subjectSec(id,shiftDay(-i));return t;}
function subjectWeekMin(id){return minutes(subjectWeekSec(id));}
function subjById(id){return S.subjects.filter(function(s){return s.id===id;})[0];}
function nextColor(){
  var used=S.subjects.map(function(s){return s.color;});
  for(var i=0;i<PALETTE.length;i++){if(used.indexOf(PALETTE[i].c)<0)return PALETTE[i].c;}
  return PALETTE[S.subjects.length%PALETTE.length].c;
}

function archTree(){
  var map={};
  (S.archives||[]).forEach(function(a){
    if(!a.month||a.month.length<7)return;
    var y=a.month.slice(0,4),m=a.month.slice(5,7);
    if(!map[y])map[y]={};
    map[y][m]=true;
  });
  return Object.keys(map).sort().reverse().map(function(y){
    return {y:y,ms:Object.keys(map[y]).sort().reverse()};
  });
}

/* ============ 计时器（基于时间戳：息屏/后台也能持续计时） ============ */
/* runStart: 本段计时开始时刻(ms)；baseElapsed/baseRemain: 开始时刻的累计值
   每次 tick 用 Date.now()-runStart 反推真实流逝秒数，不依赖 setInterval 的触发次数。
   浏览器/系统在后台会冻结 setInterval，但时间戳照常走，回前台一次性补算。 */
var T={mode:'down',subjectId:null,focusMin:25,restMin:5,running:false,phase:'focus',remain:25*60,elapsed:0,
       runStart:0,baseElapsed:0,baseRemain:25*60,overtime:0,baseOvertime:0,
       _endFired:false,_15Fired:false,_5Fired:false};
var timerId=null;
function fmtSec(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),ss=s%60;return ('0'+m).slice(-2)+':'+('0'+ss).slice(-2);}
function phaseTotal(){return (T.phase==='rest'?T.restMin:T.focusMin)*60;}
/* 每段专注开始时重置到点提醒标志，避免重复提醒 */
function resetAlertFlags(){T._endFired=false;T._15Fired=false;T._5Fired=false;}
/* 大于 1 小时的倒计时：15 / 5 分钟里程碑各响一次，后台补算跨过多个节点也按序补齐 */
function queueMilestones(){
  if(T.phase!=='focus'||T.mode!=='down'||T.focusMin<=60)return;
  if(!T._15Fired&&T.remain<=900){T._15Fired=true;queueAlert('fifteen');}
  /* 5 分钟提醒只在用户打开对应提示音后才主动触发 */
  if(!T._5Fired&&T.remain<=300&&S.soundCfg&&S.soundCfg.five&&S.soundCfg.five.on){
    T._5Fired=true;queueAlert('five');
  }
}
/* 主按钮文案：没开始 / 暂停中 / 运行中 —— 暂停后明确显示「继续」 */
function timerActionLabel(){
  if(T.running)return '暂停';
  var started=T.elapsed>0||T.overtime>0||
    (T.mode==='down'&&T.remain<(T.phase==='focus'?T.focusMin:T.restMin)*60);
  if(!started)return '开始专注';
  return T.phase==='focus'?'继续专注':'继续休息';
}
/* 把「从本段开始累计流逝的秒数」换算成当前显示值。
   runStart 固定为本段开始时刻，delta 是累计值（不是每帧增量），
   所以息屏/后台被冻结多少次都不丢秒；必要时跨多个专注/休息段。 */
function advanceTimer(now){
  var delta=Math.floor((now-T.runStart)/1000);
  if(delta<0)delta=0;                       /* 系统时间被回拨时兜底 */
  var guard=0,changed=false;
  while(guard++<1000){
    if(T.mode==='up'){
      /* 正向计时：只累加专注时长，不自动切阶段、不自动记录 */
      T.elapsed=T.baseElapsed+delta;
      T.remain=T.baseRemain+delta;
      break;
    }
    var dur=T.baseRemain;
    if(T.phase==='focus'&&!(dur>0)){
      /* 超时后暂停再继续：remain 已为 0，继续正向累计超出部分，不重起一轮倒计时 */
      T.overtime=T.baseOvertime+delta;
      T.remain=0;
      T.elapsed=T.baseElapsed+delta;
      break;
    }
    if(!(dur>0)){dur=phaseTotal();T.baseRemain=dur;}   /* 休息段兜底，防止 0 时长死循环 */
    if(delta<dur){
      var prevRemain=T.remain;
      T.remain=dur-delta;
      T.elapsed=T.baseElapsed+(T.phase==='focus'?delta:0);
      T.overtime=0;
      /* 大于 1 小时的专注：剩余时间跨过 15 / 5 分钟时各提醒一次 */
      queueMilestones();
      break;
    }
    if(T.phase==='focus'){
      /* 倒计时到点不自动切休息：超出部分继续正向累计，结束时一次记录总时长 */
      T.overtime=delta-dur;
      T.remain=0;
      T.elapsed=T.baseElapsed+dur+T.overtime;
      /* 专注到点：到点提醒（前台弹窗 + 系统闹钟）只触发一次 */
      if(!T._endFired){
        T._endFired=true;
        queueMilestones();
        queueAlert('end');
      }
      break;
    }
    /* 休息走完自动回到下一轮专注（不记录专注时长） */
    delta-=dur;
    T.phase='focus';
    T.overtime=0;
    T.baseElapsed=0;
    T.baseRemain=phaseTotal();
    T.runStart+=dur*1000;                  /* 精确推进到下一段起点，保留毫秒余量 */
    resetAlertFlags();queueAlert('rest');
    changed=true;
  }
  return changed;
}
function syncTimer(){
  if(!T.running)return;
  var changed=advanceTimer(Date.now());
  if(changed){
    persistTimer();
    rescheduleNotify();
    if(document.getElementById('toast'))toast('休息结束，开始下一轮专注');
  }else if(!T._lastPersist||Date.now()-T._lastPersist>5000){
    persistTimer();T._lastPersist=Date.now(); /* 轻量落盘，被系统杀掉也能续上 */
  }
  drainAlerts();                 /* 到点提醒：前台弹窗 + 提示音 */
  updateTimerUI();

/* 中途结束并记录：倒计时/正向均可，停表 + 落一条真实记录

function manualRecord(){

  if(T.running)syncTimer();              /* 先补算真实时长 */
  var sec=Math.floor(T.elapsed),over=T.overtime;

  T.elapsed=0;T.remain=T.focusMin*60;T.phase='focus';T.overtime=0;T.baseOvertime=0;
  T.baseElapsed=0;T.baseRemain=T.focusMin*60;T.runStart=0;resetAlertFlags();closeAlert();

/* ============ 导出中心：全程在 App 内完成，原生写文件 + 系统面板选保存位置 ============ */
function isNative(){
  var C=window.Capacitor;
  return !!(C&&((typeof C.isNativePlatform==='function'&&C.isNativePlatform())||(C.platform&&C.platform!=='web')));
}
/* 单文件 HTML 没有打包插件 JS，直接走 Capacitor 底层桥 nativePromise(plugin, method, options)；
   若运行环境已注入 Plugins 代理则优先使用。 */
function capCall(plugin,method,opts){
  var C=window.Capacitor;
  if(!C||!isNative())return Promise.reject(new Error('not-native'));
  if(C.Plugins&&C.Plugins[plugin]&&typeof C.Plugins[plugin][method]==='function')
    return C.Plugins[plugin][method](opts||{});
  if(typeof C.nativePromise==='function')return C.nativePromise(plugin,method,opts||{});
  return Promise.reject(new Error('no-bridge'));
}
/* ============ 专注提醒：系统通知（后台/息屏）+ 前台弹窗 + 提示音 ============ */
var NOTIFY_ID={focus:4101,rest:4102,fifteen:4103,five:4104,live:4110,done:4111};
var NOTIF_CHANNEL='studyspace';
var NOTIF_LOG=[];
function nlog(m){NOTIF_LOG.push(m);if(NOTIF_LOG.length>50)NOTIF_LOG.shift();}
/* 插件代理优先，否则回到底层桥 nativePromise（单文件打包场景） */
function notifCall(method,opts){
  var C=window.Capacitor;
  if(C&&C.Plugins&&C.Plugins.LocalNotifications&&typeof C.Plugins.LocalNotifications[method]==='function')
    return C.Plugins.LocalNotifications[method](opts||{});
  return capCall('LocalNotifications',method,opts||{});
}
/* 渠道 + 权限：只准备一次、串行完成，避免「首次申请」与「立即发送」竞态。
   诊断面板可调用 resetNotifReady() 重新检查（用户去系统设置放行后）。 */
var _notifReady=null;
function resetNotifReady(){_notifReady=null;}
function ensureNotif(){
  if(_notifReady)return _notifReady;
  if(!isNative()){nlog('非原生环境（浏览器），跳过系统通知');_notifReady=Promise.resolve(false);return _notifReady;}
  var C=window.Capacitor||{};
  nlog('原生环境 OK · platform='+(C.getPlatform?C.getPlatform():'unknown'));
  nlog('桥 nativePromise='+(typeof C.nativePromise==='function'?'有':'无')+' · 插件对象='+((C.Plugins&&C.Plugins.LocalNotifications)?'有':'无'));
  _notifReady=notifCall('createChannel',{id:NOTIF_CHANNEL,name:'StudySpace 专注提醒',
      description:'专注开始、到点与结束提醒',importance:4})
    .then(function(){nlog('通知渠道已就绪');return notifCall('checkPermissions',{});})
    .then(function(r){
      nlog('权限状态='+JSON.stringify(r));
      if(r&&r.display==='granted')return true;
      return notifCall('requestPermissions',{}).then(function(r2){
        nlog('申请权限后='+JSON.stringify(r2));
        return !!(r2&&r2.display==='granted');
      });
    })
    .catch(function(e){nlog('准备失败='+e);return false;});
  return _notifReady;
}
function sendNotif(o){
  ensureNotif().then(function(ok){
    if(!ok){nlog('无通知权限，未发送「'+o.title+'」');return;}
    var n={};for(var k in o)n[k]=o[k];n.channelId=NOTIF_CHANNEL;
    nlog('发送「'+n.title+'」');
    return notifCall('schedule',{notifications:[n]})
      .then(function(){nlog('已发送「'+n.title+'」');})
      .catch(function(e){nlog('发送失败「'+n.title+'」='+e);});
  }).catch(function(e){nlog('sendNotif 异常='+e);});
}
/* 会话常驻通知：一开始专注就挂上（正向/倒计时都有），ongoing 不可被划掉。
   用固定 live id，便于暂停/结束时静默取消；到点完成通知另用 done id，避免预排覆盖常驻。 */
function startLiveNotify(){
  if(!isNative())return Promise.resolve();
  var s=T.subjectId?subjById(T.subjectId):null,name=s?s.name:'StudySpace';
  var body=name+' · '+(T.mode==='down'?('倒计时 '+fmtDur(Math.max(0,T.remain))):'正向计时中');
  sendNotif({id:NOTIFY_ID.live,title:T.phase==='rest'?'休息中':'已开始专注',body:body,
    ongoing:true,autoCancel:false,schedule:{at:new Date(Date.now()+400),allowWhileIdle:true}});
  return Promise.resolve();

function cancelNotify(){
  if(!isNative())return Promise.resolve();
  return notifCall('cancel',{notifications:[{id:NOTIFY_ID.focus},{id:NOTIFY_ID.rest},
    {id:NOTIFY_ID.fifteen},{id:NOTIFY_ID.five},{id:NOTIFY_ID.live},{id:NOTIFY_ID.done}]}).then(function(){nlog('已取消会话通知');})
    .catch(function(e){nlog('取消通知失败='+e);});
}
/* 只撤掉指定通知：到点时用「先撤常驻/旧完成通知，再发新完成通知」避免同 id 互相覆盖 */
function cancelNotifIds(ids){
  if(!isNative())return Promise.resolve();
  return notifCall('cancel',{notifications:(ids||[]).map(function(id){return {id:id};})})
    .catch(function(e){nlog('取消通知失败='+e);return false;});
}
/* 预排系统闹钟：息屏/后台也能响。前台不依赖它（各 ROM 会吞横幅），另走应用内弹窗 */
function rescheduleNotify(){
  if(!isNative()||!T.running||T.mode!=='down'||T.remain<=0)return;
  var focus=T.phase==='focus',s=T.subjectId?subjById(T.subjectId):null;
  var at=new Date(Date.now()+Math.ceil(T.remain)*1000);
  /* 到点通知用独立 done id：不能和常驻 live 同 id，否则预排会立刻把「已开始专注」覆盖掉，
     倒计时就看不到常驻通知；独立 id 才能让常驻 + 到点闹钟同时存在，息屏到点照常弹。 */
  sendNotif({id:NOTIFY_ID.done,title:focus?'专注完成！':'休息结束',
    body:focus?((s?s.name:'StudySpace')+' · 本次专注 '+fmtDur(T.focusMin*60)):
                '休息结束，继续下一轮专注',
    ongoing:false,autoCancel:true,
    schedule:{at:at,allowWhileIdle:true}});
  /* 大于 1 小时的倒计时，剩 15 分钟也预排一条系统通知 */
  if(focus&&T.focusMin>60){
    var at15=new Date(Date.now()+Math.max(0,Math.ceil(T.remain)-900)*1000);
    if(at15.getTime()>Date.now())sendNotif({
      id:NOTIFY_ID.fifteen,title:'还剩 15 分钟',
      body:(s?s.name:'StudySpace')+' · 专注即将结束',
      schedule:{at:at15,allowWhileIdle:true}});
    /* 5 分钟提醒：仅在该提示音开启时预排，避免用户没开也被打扰 */
    if(!T._5Fired&&S.soundCfg&&S.soundCfg.five&&S.soundCfg.five.on){
      var at5=new Date(Date.now()+Math.max(0,Math.ceil(T.remain)-300)*1000);
      if(at5.getTime()>Date.now())sendNotif({
        id:NOTIFY_ID.five,title:'还剩 5 分钟',
        body:(s?s.name:'StudySpace')+' · 最后 5 分钟，坚持一下',
        schedule:{at:at5,allowWhileIdle:true}});
    }
  }
}
/* ---- 提示音：系统默认用 Web Audio 合成「叮咚」，自定义用上传的 dataURL ---- */
function playSound(kind,suffix){
  var c=(S.soundCfg||{})[kind];
  if(!c||!c.on)return;
  var src=c.data||'';
  if(src){
    try{var a=new Audio(src);a.currentTime=0;a.play().catch(function(){});}catch(e){}
  }else systemChime(kind);
}
function systemChime(kind){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!systemChime._ctx)systemChime._ctx=new AC();
    var ctx=systemChime._ctx;if(ctx.state==='suspended')ctx.resume();
    var notes=kind==='end'?[784,988,1175]:kind==='five'?[880,1175,784]:kind==='fifteen'?[659,784]:[659,880];
    notes.forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*0.16;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.28,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.45);
    });
  }catch(e){}
}
/* ---- 到点事件队列：advanceTimer 只置位，syncTimer 统一消费，避免补算时重复弹 ---- */
function queueAlert(kind){window.__alertQueue=window.__alertQueue||[];if(window.__alertQueue.indexOf(kind)<0)window.__alertQueue.push(kind);}
/* 到点即时系统通知：at=此刻，避免只靠提前预排被 ROM 延迟/吞掉 */
function fireNowNotify(kind){
  if(!isNative())return;
  var s=T.subjectId?subjById(T.subjectId):null;
  /* 到点通知和常驻通知必须用不同 id；否则同 id 预排会立刻覆盖「已开始专注」。
     5/15 分钟、休息结束本来就是独立补充提醒。 */
  var id=kind==='five'?NOTIFY_ID.five:kind==='fifteen'?NOTIFY_ID.fifteen:
         kind==='rest'?NOTIFY_ID.rest:NOTIFY_ID.done;
  var cfg=kind==='five'?{title:'还剩 5 分钟',body:(s?s.name:'StudySpace')+' · 最后 5 分钟，坚持一下'}:
          kind==='fifteen'?{title:'还剩 15 分钟',body:(s?s.name:'StudySpace')+' · 专注即将结束'}:
          kind==='rest'?{title:'休息结束',body:'休息好了，开始下一轮专注吧'}:
          {title:'专注完成！',body:(s?s.name:'StudySpace')+' · 本次专注 '+fmtDur(T.elapsed||T.focusMin*60)};
  var note={id:id,title:cfg.title,body:cfg.body,ongoing:false,autoCancel:true,
    schedule:{at:new Date(Date.now()+300),allowWhileIdle:true}};
  if(kind==='end'){
    /* 先撤常驻 + 旧预排，再发带实际时长的完成通知，避免两条并存或互相覆盖 */
    cancelNotifIds([NOTIFY_ID.live,NOTIFY_ID.done]).then(function(){sendNotif(note);});

function drainAlerts(){

    if(kind==='fifteen'){playSound('fifteen');showTimerAlert('fifteen');fireNowNotify('fifteen');return;}
    if(kind==='five'){playSound('five');showTimerAlert('five');fireNowNotify('five');return;}
    if(kind==='end'){playSound('end');showTimerAlert('end');fireNowNotify('end');return;}
    if(kind==='rest'){playSound('end');showTimerAlert('rest');fireNowNotify('rest');return;}
  });

function browserDownload(o){

    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=o.name;a.style.display='none';
    document.body.appendChild(a);a.click();

    return true;
  }catch(e){return false;}
}
/* 统一导出：o = {name, content, mime, title} */
function exportFile(o){
  window.__lastExport=o;window.__exportUri='';
  if(!isNative()){
    var okd=browserDownload(o);
    showExportResult({name:o.name,uri:'',native:false,downloaded:okd,title:o.title||'导出'});
    return;
  }
  function write(dir){
    return capCall('Filesystem','writeFile',
      {path:o.name,data:o.content,directory:dir,encoding:'utf8',recursive:true})
      .then(function(r){return {uri:(r&&r.uri)||'',dir:dir};});
  }
  /* 公共 Documents 在「文件管理」里直接可见；老安卓无权限时退回 App 私有目录 */
  write('DOCUMENTS').catch(function(){return write('DATA');}).then(function(res){
    if(res.uri)return res;
    return capCall('Filesystem','getUri',{path:o.name,directory:res.dir})
      .then(function(g){return {uri:(g&&g.uri)||'',dir:res.dir};})
      .catch(function(){return res;});
  }).then(function(res){
    showExportResult({name:o.name,uri:res.uri,dir:res.dir,native:true,title:o.title||'导出'});
  }).catch(function(){
    browserDownload(o);   /* 极端情况兜底：至少能下载 / 复制内容 */
    showExportResult({name:o.name,uri:'',native:false,downloaded:true,title:o.title||'导出',fallback:true});
  });
}

/* 统一下拉核心：浮层挂在锚点内部（相对定位），随滚动移动、不再脱离
   opts: [{label,color,value,sel,html}]；newCb：底部「＋新建」回调；onPick(value) */
/* 页面入场动画会给 .screen 的直接子元素制造独立层叠上下文，
   导致下拉浮层虽可见、却被后面的计时圆环盖住而点不中。
   打开时临时把锚点的整条祖先链抬到最上层，关闭后原样还原。 */
function raisePickerAncestors(el){
  window.__pickerRaised=[];
  var p=el;                                  /* 含锚点自身：统计页 .seg .s.pk-trigger 就是 overflow:hidden */
  while(p&&p!==document.body&&p.id!=='screen'){
    var cs=getComputedStyle(p);
    window.__pickerRaised.push({el:p,pos:p.style.position,z:p.style.zIndex,
      ox:p.style.overflowX,oy:p.style.overflowY});
    if(cs.position==='static')p.style.position='relative';
    p.style.zIndex='999';
    /* 锚点或祖先的 hidden/clip 会把浮层裁得完全不可见（点上去落到后面的卡片）。
       打开期间逐轴临时解除，避免影响 overflow:auto 的滚动容器；关闭后原样还原。 */
    if(cs.overflowX==='hidden'||cs.overflowX==='clip')p.style.overflowX='visible';
    if(cs.overflowY==='hidden'||cs.overflowY==='clip')p.style.overflowY='visible';
    p=p.parentElement;
  }
}
function restorePickerAncestors(){
  (window.__pickerRaised||[]).forEach(function(o){
    o.el.style.position=o.pos;o.el.style.zIndex=o.z;
    o.el.style.overflowX=o.ox;o.el.style.overflowY=o.oy;
  });
  window.__pickerRaised=[];
}
function makePicker(anchorId,opts,onPick,newCb){
  var el=document.getElementById(anchorId);if(!el)return;
  var wasOpen=el.classList.contains('open');
  closePicker();
  if(wasOpen)return;                       /* 再点一次收起 */
  el.classList.add('open');
  raisePickerAncestors(el);
  var pop=document.createElement('div');pop.className='picker-pop';pop.id='pickerPop';
  var html=opts.map(function(o){
    if(o.html)return '<div class="pi'+(o.sel?' sel':'')+'" onclick="'+o.onclick+'">'+o.html+'</div>';
    return '<div class="pi'+(o.sel?' sel':'')+'" onclick="'+o.onclick+'">'+
      (o.color?'<span class="dot" style="background:'+o.color+'"></span>':'')+
      '<span>'+o.label+'</span>'+(o.sel?'<span class="ck">✓</span>':'')+'</div>';
  }).join('');
  if(newCb)html+='<div class="pi new" onclick="'+newCb+'">＋ 新建科目</div>';
  pop.innerHTML=html;
  el.appendChild(pop);                     /* 关键：挂到锚点内，不再 append 到 body */
  window.__pickerAnchor=el;
  /* 立即注册外部点击关闭，但用时间窗忽略「打开瞬间」的重复 click，
     避免移动 WebView 一次 tap 产生多个 click 时刚打开就被关掉（表现为点不动） */
  window.__pickerOpenAt=Date.now();
  document.removeEventListener('click',outsideClose);
  document.addEventListener('click',outsideClose);
}
function picker(anchorId,cbName,current){
  var opts=S.subjects.map(function(s){
    return {label:esc(s.name),color:s.color,value:s.id,sel:s.id===current,
      onclick:cbName+'(\''+s.id+'\');closePicker()'};
  });
  if(!opts.length)opts=[{html:'<span class="muted">还没有科目，点此新建</span>',onclick:"closePicker();quickNewSubject('"+cbName+"')",sel:false}];
  makePicker(anchorId,opts,null,"closePicker();quickNewSubject('"+cbName+"')");
}
function closePicker(){
  var p=document.getElementById('pickerPop');if(p)p.remove();
  if(window.__pickerAnchor){window.__pickerAnchor.classList.remove('open');window.__pickerAnchor=null;}
  restorePickerAncestors();
  window.__pickerOpenAt=0;
  document.removeEventListener('click',outsideClose);
}
function outsideClose(e){
  if(Date.now()-(window.__pickerOpenAt||0)<350)return;   /* 打开瞬间的连击不误关 */
  if(!e.target.closest('.picker-pop')&&!e.target.closest('.picker-btn')&&!e.target.closest('.pk-trigger'))closePicker();
}

    if(f.phase)T.phase=f.phase;
    if(typeof f.baseElapsed==='number')T.baseElapsed=f.baseElapsed;
    if(typeof f.baseRemain==='number')T.baseRemain=f.baseRemain;
    if(typeof f.elapsed==='number')T.elapsed=f.elapsed;
    if(typeof f.overtime==='number')T.overtime=f.overtime;
    if(typeof f.baseOvertime==='number')T.baseOvertime=f.baseOvertime;
    if(f.runStart)T.runStart=f.runStart;
    if(typeof f._endFired==='boolean')T._endFired=f._endFired;
    if(typeof f._15Fired==='boolean')T._15Fired=f._15Fired;
    if(typeof f._5Fired==='boolean')T._5Fired=f._5Fired;
    if(typeof f.remain==='number')T.remain=f.remain;else T.remain=T.focusMin*60;
    /* 恢复运行态：用时间戳补算离开期间流逝的时间（含息屏/后台/重启） */
    if(f.running&&f.runStart){T.running=true;syncTimer();}
    if(T.running){startLiveNotify();if(T.mode==='down'&&T.remain>0)rescheduleNotify();}
  }catch(e){}
}
loadFocus();
function setMode(m){T.mode=m;T.running=false;T.phase='focus';T.remain=T.focusMin*60;T.elapsed=0;T.overtime=0;T.baseOvertime=0;
  T.baseElapsed=0;T.baseRemain=T.focusMin*60;T.runStart=0;resetAlertFlags();closeAlert();
  cancelNotify();saveFocus();render();}
function step(field,delta,min,max){
  T[field]=Math.max(min,Math.min(max,T[field]+delta));
  if(field==='focusMin'&&!T.running&&T.phase==='focus')T.remain=T.focusMin*60;
  if(field==='restMin'&&!T.running&&T.phase==='rest')T.remain=T.restMin*60;
  saveFocus();render();
}
/* 手动输入时长：失焦时校正到范围并同步计时器 */
function setTimerField(field,val,min,max){
  var n=parseInt(val,10);if(isNaN(n))n=T[field];
  n=Math.max(min,Math.min(max,n));T[field]=n;
  if(field==='focusMin'&&!T.running&&T.phase==='focus')T.remain=T.focusMin*60;
  if(field==='restMin'&&!T.running&&T.phase==='rest')T.remain=T.restMin*60;
  saveFocus();render();
}

  }

    var p=S.plans.filter(function(x){return x.id===window.__editPlan;})[0];

    S.plans.push({id:uid(),title:t,subjectId:window.__planSubject,type:type||'',

/* 某天为止的连续打卡天数（用于详情展示，不依赖今天是否已打卡） */
function streakForDay(day){
  var n=0,d=day,grace=(day===today());  /* 只有今天尚未打卡时才宽限一天 */
  for(var i=0;i<400;i++){
    if(checkinMeta(d).checked)n++;
    else{if(i===0&&grace){d=shiftDay(-1);continue;}break;}
    var dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-1);d=dstr(dt);
  }
  return n;
}

  else{

function gStep(f,d){var e=document.getElementById('gg_'+(f==='dailyMinutes'?'d':'w'));var mx=f==='dailyMinutes'?1440:10080;var v=Math.max(0,Math.min(mx,(parseInt(e.value)||0)+d));e.value=v;}

function goalClamp(){['gg_d','gg_w'].concat(S.subjects.map(function(s){return 'g_'+s.id+'_d';}),S.subjects.map(function(s){return 'g_'+s.id+'_w';})).forEach(function(id){
  var e=document.getElementById(id);if(!e)return;var mx=9000;var v=parseInt(e.value);if(isNaN(v))v=0;e.value=Math.max(0,Math.min(mx,v));});}
function saveGoalEditor(){

}

/* ============ 通用 SVG 图表 ============ */
/* 图表节点提示：鼠标移入或手指触摸时显示对应数据 */
function showChartTip(el,evt){
  var tip=document.getElementById('chartTip');
  if(!tip){tip=document.createElement('div');tip.id='chartTip';document.body.appendChild(tip);}
  tip.textContent=el.getAttribute('data-tip')||'';
  var x,y;
  if(evt.touches&&evt.touches.length){x=evt.touches[0].clientX;y=evt.touches[0].clientY;}
  else{x=evt.clientX;y=evt.clientY;}
  tip.style.left=Math.max(70,Math.min(window.innerWidth-70,x))+'px';
  tip.style.top=Math.max(40,y)+'px';
  tip.classList.add('on');
  if(evt.type==='touchstart'||evt.type==='click'){
    clearTimeout(tip._t);tip._t=setTimeout(function(){tip.classList.remove('on');},2200);
  }
}
function hideChartTip(){var tip=document.getElementById('chartTip');if(tip)tip.classList.remove('on');}
function chartHit(x,y,r,tip){
  return '<circle class="hit" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="transparent" data-tip="'+esc(tip)+'" '+
    'onmouseenter="showChartTip(this,event)" onmouseleave="hideChartTip()" '+
    'ontouchstart="showChartTip(this,event)" onclick="showChartTip(this,event)"/>';
}
function svgLine(days){
  /* days: [{label,val,color?}] 折线图 */
  if(!days.length)return '';
  var W=320,H=150,pl=28,pr=8,pt=12,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  var mx=Math.max.apply(null,days.map(function(d){return d.val;}).concat([1]));
  var step=days.length>1?iw/(days.length-1):0;
  var pts=days.map(function(d,i){return [pl+i*step, pt+ih-(d.val/mx)*ih];});
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';

/* 环形扇区：单一项占 100% 时整圆弧的起终点重合，SVG 会省略弧线不画，拆成两段半圆 */
function donutSlice(cx,cy,r,ir,a1,a2,color){
  var ang=a2-a1;
  if(ang>=Math.PI*2-1e-6){
    var xr=cx+r,xl=cx-r,xri=cx+ir,xli=cx-ir;
    return '<path d="M'+xr+' '+cy+' A'+r+' '+r+' 0 0 1 '+xl+' '+cy+
      ' A'+r+' '+r+' 0 0 1 '+xr+' '+cy+' L'+xri+' '+cy+
      ' A'+ir+' '+ir+' 0 0 0 '+xli+' '+cy+' A'+ir+' '+ir+' 0 0 0 '+xri+' '+cy+
      ' Z" fill="'+color+'" stroke="#FFFDF7" stroke-width="1"/>';
  }
  var x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
  var xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2),xi2=cx+ir*Math.cos(a1),yi2=cy+ir*Math.sin(a1);
  var large=ang>Math.PI?1:0;
  return '<path d="M'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+
    ' L'+xi1+' '+yi1+' A'+ir+' '+ir+' 0 '+large+' 0 '+xi2+' '+yi2+
    ' Z" fill="'+color+'" stroke="#FFFDF7" stroke-width="1"/>';
}
function svgPie(parts){
  /* parts:[{label,val,color}] 环形饼图 */
  var total=parts.reduce(function(a,p){return a+p.val;},0);
  var s='<svg class="chart-svg" viewBox="0 0 320 160" preserveAspectRatio="xMidYMid meet">';
  if(total<=0){return s+'<text class="ax" x="160" y="85" text-anchor="middle">暂无数据</text></svg>';}
  var cx=90,cy=80,r=58,ir=34,acc=-Math.PI/2;
  parts.forEach(function(p){
    if(p.val<=0)return;
    var ang=p.val/total*Math.PI*2,a2=acc+ang;
    s+=donutSlice(cx,cy,r,ir,acc,a2,p.color);
    var mid=acc+ang/2,hx=cx+(r+ir)/2*Math.cos(mid),hy=cy+(r+ir)/2*Math.sin(mid);
    s+=chartHit(hx,hy,(r-ir)/2,(p.tip||(p.label+' · '+p.val+' 分钟'))+' · '+Math.round(p.val/total*100)+'%');
    acc=a2;
  });
  s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="17" font-weight="600" fill="'+C.dai+'">'+total+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="9" fill="'+C.ink2+'">分钟 · 共 '+parts.filter(function(p){return p.val>0;}).length+' 项</text>';
  parts.forEach(function(p,i){var y=40+i*20;
    s+='<rect class="legend-hit" x="180" y="'+(y-11)+'" width="130" height="18" fill="transparent" data-tip="'+esc((p.tip||(p.label+' · '+p.val+' 分钟'))+' · '+Math.round(p.val/total*100)+'%')+'" onmouseenter="showChartTip(this,event)" onmouseleave="hideChartTip()" ontouchstart="showChartTip(this,event)" onclick="showChartTip(this,event)"/>';
    s+='<rect x="188" y="'+(y-9)+'" width="10" height="10" rx="3" fill="'+p.color+'"/>';
    s+='<text class="ax" x="204" y="'+y+'" font-size="10">'+esc(p.label)+' '+p.val+'分 · '+Math.round(p.val/total*100)+'%</text>';});
  return s+'</svg>';
}
/* ============ 每周学习周报 ============ */
function weekRange(offset){
  offset=offset||0;
  var d=new Date(),day=d.getDay()||7; /* 周一为周首 */
  d.setDate(d.getDate()-day+1+offset*7);
  var start=dstr(d);d.setDate(d.getDate()+6);
  return {start:start,end:dstr(d)};
}
function weekData(offset){
  var r=weekRange(offset),bySub={},totalSec=0,pomo=0,activeDays=0;
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(r.start);d.setDate(d.getDate()+i);days.push(dstr(d));}
  days.forEach(function(day){
    var sec=secondsOn(day);
    totalSec+=sec;pomo+=pomodorosOn(day);if(sec>0)activeDays++;
    sessionsOn(day).forEach(function(s){bySub[s.subjectId]=(bySub[s.subjectId]||0)+s.seconds;});
  });
  var total=minutes(totalSec);
  var parts=Object.keys(bySub).map(function(id){var sb=subjById(id);
    return {id:id,name:sb?sb.name:'未分类',color:sb?sb.color:C.ink2,min:minutes(bySub[id]),sec:bySub[id]};}).sort(function(a,b){return b.sec-a.sec;});
  var goalRate=S.goals.weeklyMinutes?Math.round(total/S.goals.weeklyMinutes*100):0;
  var wrong=S.mistakes.filter(function(m){return m.date>=r.start&&m.date<=r.end;})
    .reduce(function(a,m){return a+(m.wrong||0);},0);
  return {range:r,total:total,totalSec:totalSec,pomo:pomo,activeDays:activeDays,parts:parts,goalRate:goalRate,wrong:wrong};
}
var weekOffset=0;
function setWeekOffset(n){weekOffset=n;render();}
function genWeekAdvice(w){

  return '本周累计学习 <b>'+fmtDur(w.totalSec)+'</b>（'+w.pomo+' 个番茄），'+rateTxt+'。'+
    (top!=='—'?'<b>'+top+'</b> 投入最多':'')+(weak!=='—'?'，<b>'+weak+'</b> 相对薄弱，下周可适当补强':'')+'。'+
    (w.activeDays?'本周有 '+w.activeDays+' 天在学习，':'')+(w.activeDays>=5?'节奏很稳定，继续保持。':'试着让学习天数更连贯一些。');
}

/* 图片压缩到最长边 1600px，结果回填到目标框 */
function compressImg(input){
  var f=input.files&&input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1600,w=img.width,h=img.height;
      if(w>max||h>max){var r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var data=cv.toDataURL('image/jpeg',0.72);
      var box=document.getElementById((window.__imgTarget||'mImg')+'Box');
      if(box)box.innerHTML='<img class="big-img" src="'+data+'" style="max-height:120px">';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

    date:document.getElementById('mDate').value||today(),total:total,wrong:wrong,title:title,

    knowledge:document.getElementById('mKnow').value.split(/[、,，]/).map(function(x){return x.trim();}).filter(Boolean),
    img:imgEl?imgEl.src:'',answerImg:'',

  var m=S.mistakes.filter(function(x){return x.id===id;})[0];if(!m)return;
  var gaps=[1,3,7],stage=Math.min((m.stage||0)+1,gaps.length-1);

/* App 内用原生 HTTP 绕过 WebView 跨域，浏览器里退回 fetch */
function httpGetJson(url,headers){
  if(isNative()){
    return capCall('CapacitorHttp','request',{url:url,method:'GET',headers:headers||{}})
      .then(function(r){
        if(r&&r.statusCode&&(r.statusCode<200||r.statusCode>=300))throw new Error('HTTP '+r.statusCode);
        return (r&&typeof r.data==='string')?JSON.parse(r.data):(r&&r.data)||r;});
  }
  return fetch(url,{headers:headers||{}}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
/* 真实接口：OpenAI 兼容 /chat/completions；失败时降级为本地模拟，不吞错 */
function callAIAPI(chat,cfg){
  var p=getChatPrompt(chat);
  var msgs=[{role:'system',content:p.text}];
  chat.messages.slice(-20).forEach(function(m){
    var c=m.text||'';
    if(m.img&&/vl|vision|4o|gemini|plus/i.test(cfg.model||''))
      c=[{type:'text',text:c},{type:'image_url',image_url:{url:m.img}}];
    msgs.push({role:m.role==='user'?'user':'assistant',content:c});
  });
  var url=String(cfg.baseUrl).replace(/\/+$/,'')+'/chat/completions';
  var headers={'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey};
  var body={model:cfg.model,messages:msgs,temperature:0.7};
  /* App 内走原生 HTTP，绕过 WebView 跨域限制；浏览器里用 fetch */
  if(isNative()){
    return capCall('CapacitorHttp','request',{url:url,method:'POST',headers:headers,data:body})
      .then(function(r){
        if(r&&r.statusCode&&(r.statusCode<200||r.statusCode>=300))throw new Error('HTTP '+r.statusCode);
        var j=(r&&typeof r.data==='string')?JSON.parse(r.data):(r&&r.data)||r;
        var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
        if(!t)throw new Error('返回内容为空');return t;});
  }
  return fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(j){
      var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!t)throw new Error('返回内容为空');return t;});
}
/* 本地模拟：只作无接口时的兜底，按当前提示词与问题关键词匹配 */
function aiMockReply(q,chat){
  var pn=getChatPrompt(chat).name||'';
  if(/错题/.test(pn)||/错题|复习|记不住/.test(q))
    return '错题要**按节奏复习**才有效：\n1. 当天弄懂错因和正解\n2. 按 1/3/7 天重做一遍\n3. 能独立讲清楚才算掌握\n\n在错题本里点「已复习」，我会自动帮你排下次复习时间。';
  if(/计划/.test(pn)||/计划|安排|效率|拖延/.test(q))
    return '给你一个**专注安排建议**：\n1. 把最难的任务放在精力最好的时段\n2. 用 25 分钟番茄切分，中间休息 5 分钟\n3. 每天最多定 3 项必须完成的计划\n\n先完成最重要的那一件，比做满十条清单更有用。';
  if(/复盘/.test(pn)||/复盘|总结|进步/.test(q))
    return '一份好的**每日复盘**包含四部分：\n1. 完成情况：今天做了什么\n2. 困难不足：卡在哪里\n3. 改进措施：下次怎么做\n4. 明日重点：最重要的一件事\n\n坚持两周，你就能看到自己的进步轨迹。';
  if(/主旨|中心|阅读/.test(q))
    return '**主旨概括题**可以这样解：\n1. 先看首句和尾句，中心句常在两端\n2. 找高频词，它往往指向主题\n3. 排除只概括局部、或以偏概全的选项\n\n记住：例子、数据、引用都是佐证，不是主旨。';
  return '我理解你想问的是「'+q.slice(0,20)+(q.length>20?'…':'')+'」。\n\n建议你先拆分问题，从最关键的一步入手。如果能告诉我具体科目或题型，我可以给更针对性的方法。\n\n（当前为本地模拟回应，配置真实 AI 接口后可获得完整能力）';
}
function aiReply(chatId){
  var chat=S.chats.filter(function(c){return c.id===chatId;})[0];if(!chat)return;
  var cfg=S.aiConfig||aiCfgBlank();
  var last=chat.messages[chat.messages.length-1]||{};
  var q=last.text||'';
  function finish(ans){
    if(window.__aiThinking===chatId)window.__aiThinking='';
    chat.messages.push({role:'ai',text:ans,time:nowClock()});
    save();render();scrollChat();
  }
  if(cfg.apiKey&&cfg.baseUrl&&cfg.model){
    window.__aiThinking=chatId;
    if(curPage()==='ai')render();
    callAIAPI(chat,cfg).then(finish).catch(function(err){
      finish('⚠️ 接口调用失败（'+(err&&err.message||'网络或跨域受限')+'），已用本地模拟回应继续：\n\n'+aiMockReply(q,chat));
    });
  }else{
    finish(aiMockReply(q,chat));
  }
}
/* 上下文压缩：生成可编辑的「接力摘要」，保留未问完的原问题，下一问带着它继续 */
function textClip(s,n){s=String(s||'').replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s;}
function pendingQuestion(chat){
  var ms=chat.messages||[];
  for(var i=ms.length-1;i>=0;i--)
    if(ms[i].role==='user')return (ms[i].text||'')+(ms[i].img?'（含附图）':'');
  return '';
}
function draftChatSummary(chat){
  var ms=chat.messages||[],users=ms.filter(function(m){return m.role==='user';}),out=[];
  out.push('会话主题：'+(users.length?textClip(users[0].text,120):'（无）'));
  var prev=users.slice(0,-1).slice(-8);
  if(prev.length){
    out.push('已问过：');
    prev.forEach(function(u,i){out.push((i+1)+'. '+textClip(u.text,100)+(u.img?'（含附图）':''));});
  }
  var lastAi=null;
  for(var i=ms.length-1;i>=0;i--){if(ms[i].role==='ai'){lastAi=ms[i];break;}}
  if(lastAi)out.push('已讲到：'+textClip(lastAi.text,180));
  var q=pendingQuestion(chat);
  if(q)out.push('待继续（请接着回答这个问题）：'+q);
  return out.join('\n');
}
function compressChat(){
  var chat=S.chats.filter(function(c){return c.id===chatOpenId;})[0];if(!chat)return;
  if(window.__aiThinking===chat.id){toast('等这条回复完成再压缩');return;}

function toggleSound(k){
  var c=(S.soundCfg||soundCfgBlank())[k];c.on=!c.on;save();renderSoundSheet();
  if(k==='five'){
    /* 中途开关时同步系统预排：开了就补排，关了就撤掉已排的 5 分钟通知 */
    if(c.on){if(T.running&&T.mode==='down')rescheduleNotify();}
    else if(isNative()){notifCall('cancel',{notifications:[{id:NOTIFY_ID.five}]}).catch(function(){});}
  }
  if(c.on)playSound(k);
}
function previewSound(k){var c=(S.soundCfg||{})[k];if(c){var old=c.on;c.on=true;playSound(k);c.on=old;}}
function clearSound(k){
  var c=S.soundCfg[k];c.name='system';c.data='';save();renderSoundSheet();toast('已还原为系统提示音');
}
function uploadSound(k,input){
  var f=input.files&&input.files[0];if(!f)return;
  if(f.size>1024*1024){toast('文件过大，请选 1MB 以内的音乐');input.value='';return;}
  var rd=new FileReader();
  rd.onload=function(){
    var c=S.soundCfg[k];c.name=f.name;c.data=rd.result;save();renderSoundSheet();
    toast(k==='start'?'开始提示音已更新':k==='end'?'结束提示音已更新':k==='five'?'最后 5 分钟提示音已更新':'15 分钟提示音已更新');
  };
  rd.onerror=function(){toast('读取失败，请重试');};
  rd.readAsDataURL(f);
}

function onAIPresetChange(v){window.__aiPreset=v;loadAIPreset();}
function loadAIPreset(){
  syncAICfgDraft();
  var presets=(S.aiConfig&&S.aiConfig.presets)||[];
  var idx=window.__aiPreset===''?0:parseInt(window.__aiPreset,10);
  var p=presets[idx];
  if(!p){if(presets.length)toast('请选择一个预设');return;}
  window.__aiDraft={provider:p.provider||'',apiKey:p.apiKey||'',baseUrl:p.baseUrl||'',model:p.model||''};
  if(!p.models)p.models=[];
  S.aiConfig.models=(p.models||[]).slice();
  renderAICfgSheet();toast('已加载预设「'+(p.name||p.provider)+'」');
}
function saveAIPreset(){
  syncAICfgDraft();
  var d=window.__aiDraft;
  if(!d.provider){toast('请先填写供应商名称');return;}
  var cfg=S.aiConfig;cfg.presets=cfg.presets||[];
  var name=d.provider;
  var exist=cfg.presets.filter(function(p){return (p.name||p.provider)===name;})[0];
  var data={name:name,provider:d.provider,apiKey:d.apiKey,baseUrl:d.baseUrl,model:d.model,models:(cfg.models||[]).slice()};
  if(exist){var i=cfg.presets.indexOf(exist);cfg.presets[i]=data;window.__aiPreset=String(i);}
  else{cfg.presets.push(data);window.__aiPreset=String(cfg.presets.length-1);}
  save();renderAICfgSheet();toast(exist?'已更新预设':'已保存预设「'+name+'」');
}
function delAIPreset(){
  var presets=(S.aiConfig&&S.aiConfig.presets)||[];
  var idx=window.__aiPreset===''?0:parseInt(window.__aiPreset,10);
  var p=presets[idx];
  if(!p){toast('请选择一个预设');return;}
  confirmDo('删除预设「'+(p.name||p.provider)+'」？','只删除这个预设配置，不影响正常对话。',function(){
    S.aiConfig.presets.splice(idx,1);window.__aiPreset='';save();renderAICfgSheet();toast('已删除预设');
  });
}
function onAIModelSelect(v){var e=document.getElementById('cfgModel');if(e)e.value=v;}
function pullAIModels(btn){
  syncAICfgDraft();
  var d=window.__aiDraft;
  if(!d.baseUrl){toast('请先填写 Base URL');return;}
  var url=d.baseUrl.replace(/\/+$/,'')+'/models';
  if(btn){btn.textContent='拉取中…';btn.disabled=true;}
  var headers={};if(d.apiKey)headers['Authorization']='Bearer '+d.apiKey;
  httpGetJson(url,headers).then(function(j){
      var ids=(j.data||[]).map(function(m){return m.id;}).filter(Boolean);
      if(!ids.length)throw new Error('返回列表为空');
      S.aiConfig.models=ids;save();
      renderAICfgSheet();toast('拉取到 '+ids.length+' 个模型');
    }).catch(function(err){
      if(btn){btn.textContent='拉取列表';btn.disabled=false;}
      toast('拉取失败：'+(err.message||'网络或跨域受限，请手动填写模型名'));
    });
}
function saveAICfg(){
  syncAICfgDraft();
  var d=window.__aiDraft||aiCfgBlank();

  cfg.provider=d.provider;cfg.apiKey=d.apiKey;cfg.baseUrl=d.baseUrl;cfg.model=d.model;

function importDataJSON(input){
  var f=input.files&&input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data||!data.subjects){toast('文件格式不对');return;}
      confirmDo('导入这份备份？','将用备份里的数据覆盖当前全部数据，建议先导出当前备份。',function(){
        S=migrate(data);save();render();toast('导入成功');});
    }catch(err){toast('文件格式不对');}
    input.value='';
  };
  reader.readAsText(f);
}
